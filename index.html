<style>
:root{
  --bg-deep:#04263F;
  --bg-panel:#0B3555;
  --foam:#ECE8DE;
  --foam-dim:#9AAABB;
  --amber-1:#FF5A2E;
  --amber-2:#F03A17;
  --amber-3:#C22E12;
  --copper-dark:#8A2410;
  --hop:#5C9165;
  --hop-dark:#3F6448;
  --alert:#C1432E;
  --alert-dark:#7E2A1D;
  --line:rgba(236,232,222,0.10);
  --shadow:0 8px 24px rgba(0,0,0,0.4);
  --radius:14px;
  font-family:'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg-deep);color:var(--foam);min-height:100vh;}
h1,h2,h3,h4{font-family:'Arial Narrow','Segoe UI',sans-serif;letter-spacing:0.5px;margin:0;text-transform:uppercase;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select{font-family:inherit;}

#app{max-width:1180px;margin:0 auto;padding:0 0 60px;}

/* ---------- HEADER / HERO ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2A1B10 0%,#1B120C 100%);
  padding:22px 24px 34px;border-bottom:3px solid var(--amber-3);
}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(180deg,var(--foam),var(--foam-dim));
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:20px;color:#1F2127;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(255,90,46,0.25);
  overflow:hidden;padding:8px;
}
.brand-mark img{width:100%;height:100%;object-fit:contain;}
.brand-text h1{font-size:22px;color:var(--foam);}
.brand-text p{margin:2px 0 0;font-size:12px;color:var(--foam-dim);text-transform:none;}
.hero-user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--foam-dim);}
.clock-box{text-align:center;font-family:'Courier New',monospace;}
.clock-time{font-size:22px;font-weight:800;letter-spacing:1px;color:var(--amber-1);}
.clock-date{font-size:11px;color:var(--foam-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.blink-colon{animation:blinkColon 1s steps(1) infinite;}
@keyframes blinkColon{50%{opacity:0;}}
.pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.pill-adm{background:var(--amber-1);color:#1F2127;}
.pill-user{background:rgba(255,247,233,0.15);color:var(--foam);}
.logout-btn{background:transparent;border:1px solid var(--line);color:var(--foam-dim);padding:6px 12px;border-radius:8px;font-size:12px;}
.logout-btn:hover{border-color:var(--amber-2);color:var(--foam);}

.pour{height:28px;margin-top:18px;border-radius:8px;overflow:hidden;position:relative;
  background:linear-gradient(90deg,var(--amber-3),var(--amber-1) 40%,var(--amber-2) 60%,var(--amber-1) 100%);
  background-size:200% 100%;animation:pourwave 6s linear infinite;}
@keyframes pourwave{0%{background-position:0% 0;}100%{background-position:200% 0;}}
.pour-text{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;
  white-space:nowrap;font-weight:800;font-size:12px;letter-spacing:3px;color:#1F2127;
  animation:marquee 14s linear infinite;}
@keyframes marquee{0%{transform:translateX(100vw);}100%{transform:translateX(-100%);}}

/* ---------- NAV ---------- */
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:16px 24px 0;}
.nav button{
  background:var(--bg-panel);color:var(--foam-dim);border:1px solid var(--line);
  padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.3px;transition:all .15s;
}
.nav button:hover{border-color:var(--amber-2);color:var(--foam);}
.nav button.active{background:linear-gradient(180deg,var(--amber-1),var(--amber-2));color:#1F2127;border-color:transparent;}

.content{padding:22px 24px 0;}

/* ---------- CARDS / KPIs ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.kpi.alert .num{color:var(--alert);}
.kpi.hop .num{color:var(--hop);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h2{font-size:16px;color:var(--foam);}
.section-title span{font-size:12px;color:var(--foam-dim);text-transform:none;}

.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.card h3{font-size:15px;color:var(--foam);text-transform:none;}
.card .meta{font-size:12px;color:var(--foam-dim);margin-top:4px;line-height:1.6;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;}
.badge-aguardando{background:rgba(255,201,77,0.18);color:var(--amber-1);}
.badge-liberado{background:rgba(124,154,61,0.22);color:var(--hop);}
.badge-recolha{background:rgba(193,67,46,0.2);color:#FF8A72;}
.badge-concluido{background:rgba(124,154,61,0.3);color:var(--hop);}
.badge-excluido{background:rgba(255,255,255,0.08);color:var(--foam-dim);}
.badge-fim{background:var(--alert);color:var(--foam);}
.badge-rota{background:rgba(255,90,46,0.2);color:var(--amber-1);}

.btn{padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.btn-amber{background:linear-gradient(180deg,var(--amber-1),var(--amber-2));color:#1F2127;}
.btn-amber:hover{filter:brightness(1.06);}
.btn-hop{background:var(--hop);color:#12200A;}
.btn-alert{background:var(--alert);color:var(--foam);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--foam-dim);}
.btn-ghost:hover{border-color:var(--amber-2);color:var(--foam);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* ---------- FORMS ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;color:var(--foam-dim);text-transform:uppercase;letter-spacing:0.3px;font-weight:600;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=password],.field select,.field textarea{
  background:var(--bg-deep);border:1px solid var(--line);color:var(--foam);
  padding:10px 12px;border-radius:8px;font-size:14px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber-2);}
.field-check{flex-direction:row;align-items:center;gap:8px;}
.field-check input{width:18px;height:18px;accent-color:var(--amber-2);}

.toggle-flow{
  padding:10px 16px;border-radius:9px;border:2px solid var(--line);background:transparent;color:var(--foam-dim);
  font-weight:800;font-size:12px;letter-spacing:0.5px;
}
.toggle-flow.on{background:var(--alert);border-color:var(--alert);color:var(--foam);}

.item-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px;padding:10px;background:var(--bg-deep);border-radius:9px;border:1px solid var(--line);}
.item-row.simple{grid-template-columns:2fr 1fr auto;}
.remove-item{background:var(--alert-dark);color:var(--foam);border-radius:7px;padding:9px 12px;font-size:16px;line-height:1;}

.divider{border:none;border-top:1px solid var(--line);margin:20px 0;}

.hist-entry{font-size:12px;color:var(--foam-dim);padding:8px 0;border-bottom:1px dashed var(--line);position:relative;padding-right:26px;}
.remove-x-inline{position:absolute;right:0;top:6px;background:transparent;border:none;color:var(--alert);cursor:pointer;padding:2px;font-size:13px;}
.hist-entry b{color:var(--foam);}

.empty-state{text-align:center;padding:40px 20px;color:var(--foam-dim);}
.empty-state i{display:block;font-size:13px;}

.flag-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--bg-deep);border-radius:8px;border:1px solid var(--line);margin-bottom:8px;}
.flag-row.done{border-color:var(--hop);}
.flag-row label{display:flex;align-items:center;gap:8px;font-size:13px;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:18px;padding:36px 32px;width:100%;max-width:380px;box-shadow:var(--shadow);}
.login-card .brand-mark{margin:0 auto 14px;width:72px;height:72px;padding:10px;}
.login-card h1{text-align:center;font-size:20px;}
.login-card p.sub{text-align:center;font-size:12px;color:var(--foam-dim);text-transform:none;margin-top:6px;margin-bottom:24px;}
.login-hint{margin-top:18px;font-size:11px;color:var(--foam-dim);text-align:center;text-transform:none;line-height:1.6;}
.err-msg{background:rgba(193,67,46,0.18);border:1px solid var(--alert);color:#FF9C86;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;text-transform:none;}
.ok-msg{background:rgba(124,154,61,0.18);border:1px solid var(--hop);color:#C6E39A;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:14px;text-transform:none;}

.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.search-bar input,.search-bar select{background:var(--bg-panel);border:1px solid var(--line);color:var(--foam);padding:9px 12px;border-radius:8px;font-size:13px;}

table.report-tbl{width:100%;border-collapse:collapse;font-size:12px;}
table.report-tbl th,table.report-tbl td{border:1px solid var(--line);padding:7px 8px;text-align:left;}
table.report-tbl th{background:var(--bg-deep);color:var(--amber-1);text-transform:uppercase;font-size:10px;}

.chip-required{color:#FF9C86;font-size:11px;margin-left:4px;}
.btn i, .nav button i, .logout-btn i{margin-right:6px;vertical-align:-2px;font-size:14px;}
.btn-ghost i, .logout-btn i{color:var(--amber-1);}
.nav button:not(.active) i{color:var(--amber-1);}
.nav button.active i{color:#1F2127;}
.card i, h3 i{color:var(--amber-1);}
.kpi-btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;transition:border-color .15s;}
.kpi-btn:hover{border-color:var(--amber-2);}
.kpi-btn .num{font-size:30px;font-weight:800;color:var(--amber-1);}
.kpi-btn .label{font-size:12px;color:var(--foam-dim);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;display:flex;align-items:center;gap:4px;}
.kpi-btn.alert .num{color:var(--alert);}
.kpi-btn.hop .num{color:var(--hop);}
.kpi{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.kpi .num{font-size:30px;font-weight:800;color:var(--amber-1);}
.kpi .label{font-size:12px;color:var(--foam-dim);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;display:flex;align-items:center;gap:4px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow);}
.badge-parcial{background:rgba(240,161,35,0.22);color:var(--amber-1);}
.pwd-wrap{position:relative;}
.pwd-wrap input{padding-right:38px !important;}
.pwd-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--foam-dim);cursor:pointer;padding:4px;display:flex;}
.pwd-toggle:hover{color:var(--amber-1);}
@media(max-width:640px){
  .content{padding:16px 14px 0;}
  .hero{padding:16px 16px 26px;}
  .nav{padding:14px 14px 0;}
  .item-row, .form-grid { grid-template-columns:1fr !important; }
  .remove-item{justify-self:end;width:fit-content;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

  {versao:"1.34.2", data:"2026-08-17", mudancas:["Busca por ativo/patrimônio agora funciona em cascata: se você já filtrou por um cliente no campo de cima, a busca por ativo procura só dentro dos pedidos daquele cliente — não em todos do sistema","Busca por ativo/patrimônio também ficou automática (ativo, patrimônio e datas), sem precisar clicar em Buscar"]},
  {versao:"1.34.1", data:"2026-08-17", mudancas:["Busca por cliente/pedido agora filtra automaticamente enquanto você digita (com uma pequena pausa), sem precisar clicar em Buscar — o botão continua lá, mas virou opcional"]},
  {versao:"1.34.0", data:"2026-08-16", mudancas:["Busca por cliente agora mostra também os ativos (com patrimônio) que foram pra aquele pedido, direto no resultado — ex: \"Chopeira — Patr. 34 · Barril Pilsen 30L — Patr. 744\"","Nova busca por ativo/patrimônio na tela Buscar: escolha o tipo de ativo e/ou digite um número de patrimônio (com período de datas opcional) para ver todos os pedidos/clientes onde aquele ativo específico já foi alocado"]},
  {versao:"1.33.2", data:"2026-08-14", mudancas:["O card \"Sem valor ainda\" no Financeiro agora é clicável — mostra a lista dos pedidos sem valor registrado, com botão \"Preencher valor\" em cada um pra já abrir a edição direto"]},
  {versao:"1.33.1", data:"2026-08-14", mudancas:["Corrigido bug real: um ativo já recolhido fisicamente (marcado como \"Recolhido\" numa recolha parcial) continuava travado como \"em uso\" no pedido antigo, impedindo que o mesmo número de patrimônio fosse usado num pedido novo. Agora, assim que um item é marcado como recolhido, o patrimônio fica livre para reutilização em outro pedido, mesmo que o pedido antigo ainda tenha outros itens pendentes de recolha"]},
  {versao:"1.33.0", data:"2026-08-11", mudancas:["Novo campo \"Quem retira/recebe\" no pedido, para quando quem faz o pedido não é quem vai retirar/receber os ativos (ex: pedido feito no nome de alguém, mas retirado por outra pessoa) — aparece em todas as telas do pedido","Botão \"RETORNADO NO BEER SALES\" agora fica travado (desabilitado) para usuário comum até que todos os ativos da recolha física estejam marcados como recolhidos — ADM continua podendo confirmar a qualquer momento, inclusive parcial","Novo botão \"Alterar pedido completo\" (ADM), disponível em Pedidos Agendados, Recolhas e Histórico — permite corrigir número do pedido, nome do cliente, quem retirou/recebeu e outros dados a qualquer momento, mesmo com o pedido já 100% concluído (útil para pedidos fora fluxo que só recebem o número real do BEER SALES depois)","Novo campo \"Cliente devolve os ativos na empresa\" (complementar ao \"cliente retira na empresa\" que já existia) — aparece como aviso nos cards de Recolhas Pendentes"]},
  {versao:"1.32.2", data:"2026-08-07", mudancas:["Corrigido: usuário comum ainda conseguia mexer num pedido já 100% concluído. Agora a tela trava completamente pra usuário comum sempre que a recolha física estiver completa (aguardando BEER SALES ou já concluído) — só ADM continua com acesso total","Confirmar o retorno no BEER SALES agora pede uma confirmação explícita (\"os ativos realmente voltaram fisicamente?\"), pra evitar clique errado","Novo botão \"Reverter\" no Histórico (ADM), pra desfazer uma confirmação de retorno no BEER SALES feita por engano — volta o pedido pra Recolhas Pendentes"]},
  {versao:"1.32.1", data:"2026-08-07", mudancas:["Quando falta só a confirmação do BEER SALES, usuários comuns (não-ADM) agora veem uma tela simplificada e travada, com só o botão de confirmar ativo — evita mexer sem querer em algo que já está pronto. ADM continua com acesso completo pra correções, se precisar"]},
  {versao:"1.32.0", data:"2026-08-07", mudancas:["Pedidos já 100% recolhidos fisicamente, faltando só o retorno no BEER SALES, não aparecem mais na lista geral de \"Recolhas Pendentes\" — ficam só na aba de pendência do BEER SALES, com um atalho pra acessar de qualquer uma das duas telas"]},
  {versao:"1.31.9", data:"2026-08-07", mudancas:["Corrigido bug real: clicar no card \"Pendência BEER SALES\" do painel inicial quebrava a tela silenciosamente (função usada só existia dentro do painel, não na tela de Recolhas). Agora abre certinho, mostrando só quem já foi recolhido fisicamente e falta confirmar no BEER SALES","O rótulo \"Próximo fim de semana\" agora vira \"Deste fim de semana\" quando hoje já é sexta, sábado ou domingo — só volta a dizer \"Próximo\" a partir de segunda-feira"]},
  {versao:"1.31.8", data:"2026-08-07", mudancas:["Corrigido: o filtro \"Pendência BEER SALES\" (clicando no card do painel inicial) estava mostrando também pedidos que ainda nem foram recolhidos fisicamente. Agora só aparece quem já está 100% recolhido e falta só confirmar o retorno no BEER SALES"]},
  {versao:"1.31.7", data:"2026-08-07", mudancas:["Corrigido o ícone da tela inicial do celular: o touro branco tinha fundo transparente, e o celular preenchia isso com branco, deixando o ícone quase invisível. Agora o ícone tem fundo escuro sólido embutido, com contraste garantido em qualquer aparelho"]},
  {versao:"1.31.6", data:"2026-08-07", mudancas:["Ícone do sistema (favicon, tela inicial e cabeçalho) agora usa só o touro da logo, recortado da arte original — sem o texto \"STIER\" junto","O título mudou de \"Stier Bier\" para \"Stier Delivery\" no cabeçalho e na tela de login"]},
  {versao:"1.31.5", data:"2026-08-07", mudancas:["Pedidos marcados como \"cliente coleta na empresa\" agora mostram um aviso visível nos cards do painel inicial (Hoje/Amanhã/Fim de semana), pra ficar claro de cara que não é entrega"]},
  {versao:"1.31.4", data:"2026-08-07", mudancas:["Corrigido: pedidos de hoje ou amanhã não aparecem mais duplicados na seção \"Próximo fim de semana\" quando o dia cai dentro do período do fim de semana"]},
  {versao:"1.31.3", data:"2026-08-03", mudancas:["Reduzido o tamanho dos gráficos do Financeiro (faturamento por cidade e por mês), que estavam ocupando espaço demais na tela"]},
  {versao:"1.31.2", data:"2026-08-03", mudancas:["Novo botão \"Recolhido por\" nos pedidos concluídos do Histórico, pra preencher manualmente quem recolheu quando esse dado ficou em branco (ex: pedidos importados do BEER SALES, que não trazem essa informação no PDF)"]},
  {versao:"1.31.1", data:"2026-08-03", mudancas:["Novo botão \"Excluir de vez\" (ADM), disponível em Pedidos Agendados, Recolhas Pendentes e Histórico — remove um pedido completamente do sistema, de qualquer etapa, sem precisar cancelar/voltar status por status. Útil pra limpar pedidos de teste. Diferente de \"Cancelar\", não deixa rastro no Histórico"]},
  {versao:"1.31.0", data:"2026-08-03", mudancas:["Removida a tela separada de \"Relatório\" — agora os filtros ficam direto no Histórico: entregue por, recolhido por, e período de entrega, com um botão para exportar a lista já filtrada em PDF"]},
  {versao:"1.30.2", data:"2026-08-03", mudancas:["Corrigido bug sério: uma instabilidade de internet ao abrir o sistema podia fazer ele recriar pedidos fictícios de demonstração (do desenvolvimento original) e gravá-los junto com os dados reais. Isso nunca mais vai acontecer — removida essa geração automática, e agora, se a conexão falhar ao carregar, o sistema avisa claramente e não grava nada, em vez de arriscar misturar dados"]},
  {versao:"1.30.1", data:"2026-08-03", mudancas:["Listas de Aguardando Separação, Liberado p/ Entrega, Recolhas Pendentes e Pedidos Agendados agora vêm ordenadas por data (a mais próxima primeiro), em vez de pela ordem de criação"]},
  {versao:"1.30.0", data:"2026-08-03", mudancas:["Removida a mensagem pronta para o WhatsApp do Relatório","Relatório em PDF simplificado para formato de lista/relação: pedido, cliente, data de entrega, quem entregou, data de recolha e quem recolheu — agora o sistema também registra quem faz cada recolha","Painel inicial agora mostra só pedidos até o próximo fim de semana; removida a seção \"Todos os pedidos em andamento\" (pedidos mais distantes ficam disponíveis em Pedidos Agendados)","Seções Hoje/Amanhã/Fim de semana só aparecem quando têm pedido — se estiverem vazias, somem da tela em vez de mostrar mensagem de vazio"]},
  {versao:"1.29.2", data:"2026-07-31", mudancas:["Ícone do app (aba do navegador e tela inicial do celular) agora usa uma versão branca da logo, pra aparecer direito em fundos escuros — a logo preta original continua igual dentro do sistema, no círculo claro do cabeçalho"]},

let DATA = null;
let SESSION = null;
let SESSAO_ATUAL_ID = null;
let VIEW = "dashboard";

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function gerarSalt(){ return Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2); }
async function hashSenha(senha, salt){
  if(!window.crypto || !window.crypto.subtle){ return null; }
  const dados = new TextEncoder().encode(senha+"::"+salt);
  const buffer = await window.crypto.subtle.digest("SHA-256", dados);
  return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function migrarSenhasAntigas(){
  let mudou = false;
  for(const u of DATA.users){
    if(u.password && !u.hash){
      const salt = gerarSalt();
      const hash = await hashSenha(u.password, salt);
      if(hash){ u.salt = salt; u.hash = hash; delete u.password; mudou = true; }
    }
  }
  if(mudou) await persist();
}
function abrirModalTrocarSenha(){
  return new Promise(resolve=>{
    openModal(`
      <h3 style="font-size:15px;margin-bottom:14px;color:var(--foam);text-transform:none;">Alterar minha senha</h3>
      <div class="field" style="margin-bottom:10px;"><label>Senha atual</label>${campoSenha("senha-atual")}</div>
      <div class="field" style="margin-bottom:10px;"><label>Nova senha</label>${campoSenha("senha-nova")}</div>
      <div class="field" style="margin-bottom:14px;"><label>Confirmar nova senha</label>${campoSenha("senha-confirma")}</div>
      <div id="senha-erro"></div>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button class="btn btn-ghost btn-sm" id="senha-cancelar">${ic('x')}Cancelar</button>
        <button class="btn btn-amber btn-sm" id="senha-confirmar">${ic('check')}Salvar nova senha</button>
      </div>
    `);
    bindTogglesSenha();
    document.getElementById("senha-cancelar").onclick = ()=>{ closeModalIfAny(); resolve(); };
    document.getElementById("senha-confirmar").onclick = async ()=>{
      const atual = document.getElementById("senha-atual").value;
      const nova = document.getElementById("senha-nova").value;
      const confirma = document.getElementById("senha-confirma").value;
      const errEl = document.getElementById("senha-erro");
      if(!atual || !nova || !confirma){ errEl.innerHTML = '<div class="err-msg">Preencha todos os campos.</div>'; return; }
      if(nova !== confirma){ errEl.innerHTML = '<div class="err-msg">A nova senha e a confirmação não coincidem.</div>'; return; }
      if(nova.length < 4){ errEl.innerHTML = '<div class="err-msg">A nova senha deve ter pelo menos 4 caracteres.</div>'; return; }
      const user = DATA.users.find(u=>u.username===SESSION.username);
      let senhaCorreta = false;
      if(user.hash){
        const hashAtual = await hashSenha(atual, user.salt);
        senhaCorreta = hashAtual===user.hash;
      } else if(user.password){
        senhaCorreta = user.password===atual;
      }
      if(!senhaCorreta){ errEl.innerHTML = '<div class="err-msg">Senha atual incorreta.</div>'; return; }
      const salt = gerarSalt();
      const hash = await hashSenha(nova, salt);
      if(hash){ user.hash = hash; user.salt = salt; delete user.password; }
      else { user.password = nova; }
      closeModalIfAny();
      await persist();
      await alertModal("Senha alterada com sucesso.");
      resolve();
    };
  });
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
function parseValorBR(txt){
  const limpo = txt.replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".");
  const n = parseFloat(limpo);
  return isNaN(n) ? null : n;
}
function fmtMoeda(n){
  if(n==null || isNaN(n)) return "—";
  return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function fmtDateTime(iso){ if(!iso) return "—"; const dt=new Date(iso); return dt.toLocaleDateString('pt-BR')+" "+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ic(name){ return `<i class="ti ti-${name}" aria-hidden="true"></i>`; }
function campoSenha(id, valorAtributos){
  return `<div class="pwd-wrap"><input type="password" id="${id}" ${valorAtributos||""}><button type="button" class="pwd-toggle" data-toggle-alvo="${id}">${ic('eye')}</button></div>`;
}
function bindTogglesSenha(){
  document.querySelectorAll(".pwd-toggle").forEach(btn=>{
    btn.onclick = ()=>{
      const input = document.getElementById(btn.dataset.toggleAlvo);
      if(!input) return;
      const mostrando = input.type==="text";
      input.type = mostrando ? "password" : "text";

/* ---- Modal próprio (não depende de alert/prompt/confirm nativos do navegador,
   que podem ser bloqueados dependendo de onde este arquivo é aberto) ---- */
function closeModalIfAny(){ const el=document.getElementById('modal-overlay'); if(el) el.remove(); }
function openModal(contentHtml){
  closeModalIfAny();
  const overlay = document.createElement('div');
  overlay.id='modal-overlay';
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal-box">${contentHtml}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModalIfAny(); });
  return overlay;
}
function alertModal(message){
  return new Promise(resolve=>{
    openModal(`
      <p style="font-size:14px;line-height:1.6;margin:0 0 18px;color:var(--foam);text-transform:none;">${escapeHtml(message)}</p>
      <div style="display:flex;justify-content:flex-end;"><button class="btn btn-amber btn-sm" id="modal-ok">${ic('check')}Entendi</button></div>
    `);
    document.getElementById('modal-ok').onclick = ()=>{ closeModalIfAny(); resolve(); };
  });
}
function promptModal(title, placeholder){
  return new Promise(resolve=>{
    openModal(`
      <h3 style="font-size:15px;margin-bottom:12px;color:var(--foam);text-transform:none;">${escapeHtml(title)}</h3>
      <textarea id="modal-input" rows="3" style="width:100%;background:var(--bg-deep);border:1px solid var(--line);color:var(--foam);border-radius:8px;padding:10px;font-size:14px;" placeholder="${escapeHtml(placeholder||'')}"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
        <button class="btn btn-ghost btn-sm" id="modal-cancel">${ic('x')}Cancelar</button>
        <button class="btn btn-amber btn-sm" id="modal-confirm">${ic('check')}Confirmar</button>
      </div>
    `);
    const input = document.getElementById('modal-input');
    input.focus();
    document.getElementById('modal-cancel').onclick = ()=>{ closeModalIfAny(); resolve(null); };
    document.getElementById('modal-confirm').onclick = ()=>{
      const val = input.value.trim();
      closeModalIfAny();
      resolve(val || null);
    };
  });
}

async function loadData(){
  try{
    const snap = await db.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC).get();
    DATA = (snap.exists && snap.data().json) ? JSON.parse(snap.data().json) : defaultData();
  }catch(e){
    console.error("Erro ao carregar dados do Firebase", e);
    document.getElementById("app").innerHTML = `
      <div style="max-width:420px;margin:80px auto;text-align:center;padding:24px;">
        <h2 style="color:var(--foam);">Não foi possível carregar os dados</h2>
        <p class="meta" style="margin:14px 0;">Verifique sua conexão com a internet e recarregue a página. Por segurança, nada foi alterado no banco de dados.</p>
        <button class="btn btn-amber" onclick="location.reload()">Recarregar página</button>
      </div>`;
    throw e;
  }
  if(!DATA.users || DATA.users.length===0){ DATA = defaultData(); await persist(); }
  await migrarSenhasAntigas();
  if(!DATA.sessoes){ DATA.sessoes = []; }
  if(!DATA.pedidos){ DATA.pedidos = []; }
  const pedidosSemDuplicar = mergePorChave([], DATA.pedidos, "id");
  if(pedidosSemDuplicar.length !== DATA.pedidos.length){
    DATA.pedidos = pedidosSemDuplicar;
    await persist(1, {forceOverwrite:true});
  }
  if(!DATA.seedAplicado){ DATA.seedAplicado = true; await persist(); }
}
let SAVE_FAILED = false;
function mergePorChave(servidorArr, localArr, chave){
  const map = new Map();
  (servidorArr||[]).forEach(item=> map.set(item[chave], item));
  (localArr||[]).forEach(item=> map.set(item[chave], item));
  return Array.from(map.values());
}
async function persist(attempt, opcoes){
  attempt = attempt || 1;
  opcoes = opcoes || {};
  try{
    const ref = db.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC);
    if(opcoes.forceOverwrite){
      await ref.set({json: JSON.stringify(DATA), atualizadoEm: new Date().toISOString()});
    } else {
      await db.runTransaction(async (tx)=>{
        const snap = await tx.get(ref);
        const servidor = (snap.exists && snap.data().json) ? JSON.parse(snap.data().json) : null;
        if(servidor){
          DATA.pedidos = mergePorChave(servidor.pedidos, DATA.pedidos, "id");
          DATA.users = mergePorChave(servidor.users, DATA.users, "username");
          DATA.sessoes = mergePorChave(servidor.sessoes, DATA.sessoes, "id");
          DATA.exclusoes = mergePorChave(servidor.exclusoes, DATA.exclusoes, "pedidoId");
          DATA.seedAplicado = DATA.seedAplicado || servidor.seedAplicado;
        }
        tx.set(ref, {json: JSON.stringify(DATA), atualizadoEm: new Date().toISOString()});
      });
    }
    if(SAVE_FAILED){ SAVE_FAILED = false; renderSaveBanner(); }
  }catch(e){
    console.error("Erro ao salvar dados (tentativa "+attempt+")", e);
    if(attempt < 3){
      await new Promise(r=>setTimeout(r, 600*attempt));
      return persist(attempt+1, opcoes);
    }
    SAVE_FAILED = true;
    renderSaveBanner();
  }
}
function renderSaveBanner(){
  let banner = document.getElementById("save-banner");
  if(!SAVE_FAILED){
    if(banner) banner.remove();
    return;
  }
  if(!banner){
    banner = document.createElement("div");
    banner.id = "save-banner";
    banner.style.cssText = "position:sticky;top:0;z-index:50;background:var(--alert);color:#fff;padding:10px 16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;";
    document.body.prepend(banner);
  }
  banner.innerHTML = `<span>Não foi possível salvar a última alteração no servidor. Seus dados podem ser perdidos se você fechar a página agora.</span>
    <button class="btn btn-sm" style="background:#fff;color:var(--alert-dark);" id="retry-save-btn">${ic('refresh')}Tentar salvar novamente</button>`;
  document.getElementById("retry-save-btn").onclick = ()=>persist();
}

function nextWeekendDates(){
  const now = new Date(); now.setHours(0,0,0,0);
  const day = now.getDay();
  let friday;
  if(day===0){ friday = new Date(now); friday.setDate(now.getDate()-2); }
  else if(day===5 || day===6){ friday = new Date(now); friday.setDate(now.getDate()-(day-5)); }
  else { friday = new Date(now); friday.setDate(now.getDate()+(5-day)); }
  const saturday = new Date(friday); saturday.setDate(friday.getDate()+1);
  const sunday = new Date(friday); sunday.setDate(friday.getDate()+2);
  return [friday, saturday, sunday].map(d=>d.toISOString().slice(0,10));
}
function tomorrowISO(){
  const d = new Date(); d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function within7Days(iso){
  if(!iso) return false;
  const d = new Date(iso+"T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = (d-now)/86400000;
  return diff>=0 && diff<=7;
}

function pedidosAtivos(){ return DATA.pedidos.filter(p=>p.status!=="EXCLUIDO"); }

function patrimonioEmUsoPor(ativo, patrimonio, ignorarPedidoId){
  for(const p of pedidosAtivos()){
    if(p.id===ignorarPedidoId) continue;
    if(p.status==="CONCLUIDO") continue;
    const jaRecolhidoFisicamente = (itAtivo, itPatrimonio)=>{
      if(!p.recolha || !p.recolha.itens) return false;
      return p.recolha.itens.some(ri=> ri.ativo===itAtivo && (ri.patrimonio||"").trim().toLowerCase()===(itPatrimonio||"").trim().toLowerCase() && ri.recolhido);
    };
    const listas = [];
    if(p.separacao && p.separacao.itens) listas.push(...p.separacao.itens);
    if(p.extras) listas.push(...p.extras);
    if(p.trocas) p.trocas.forEach(t=>{ if(t.patrimonioNovo) listas.push({ativo:t.ativoNovo, patrimonio:t.patrimonioNovo}); });
    for(const it of listas){
      if(it.patrimonio && it.patrimonio.trim().toLowerCase()===patrimonio.trim().toLowerCase() && it.ativo===ativo){
        if(jaRecolhidoFisicamente(it.ativo, it.patrimonio)) continue;
        return p.numero;
      }
    }
  }
  return null;
}

  if(status==="AGUARDANDO_SEPARACAO") return "separacao";
  if(status==="LIBERADO_PARA_ENTREGA") return "entrega";
  if(status==="RECOLHAS_PENDENTES") return "recolhas";
  if(status==="CONCLUIDO"||status==="EXCLUIDO") return "historico";
  return "pedidos";
}
function itensDoPedidoResumo(p){
  const itens = (p.separacao && p.separacao.itens && p.separacao.itens.length) ? p.separacao.itens : (p.itensPedido||[]);
  const base = itens.map(it=>({ativo:it.ativo, patrimonio:it.patrimonio||""}));
  const extras = (p.extras||[]).map(ex=>({ativo:ex.ativo, patrimonio:ex.patrimonio||"", extra:true}));
  return base.concat(extras);
}
function buscarPorAtivoPatrimonio(){
  const {ativo, patrimonio, inicio, fim} = BUSCA_ATIVO_FILTRO;
  const patrimonioBusca = patrimonio.trim().toLowerCase();
  const termoCliente = BUSCA_TERMO.trim().toLowerCase();
  if(!ativo && !patrimonioBusca) return [];
  const resultados = [];
  DATA.pedidos.forEach(p=>{
    if(p.status==="EXCLUIDO") return;
    if(termoCliente){
      const bate = (p.numero||"").toLowerCase().includes(termoCliente) ||
        (p.cliente||"").toLowerCase().includes(termoCliente) ||
        (p.cidade||"").toLowerCase().includes(termoCliente) ||
        (p.endereco||"").toLowerCase().includes(termoCliente) ||
        (p.telefone||"").toLowerCase().includes(termoCliente);
      if(!bate) return;
    }
    if(inicio && (!p.dataEntrega || p.dataEntrega < inicio)) return;
    if(fim && (!p.dataEntrega || p.dataEntrega > fim)) return;
    const itensCandidatos = [];
    if(p.separacao && p.separacao.itens) itensCandidatos.push(...p.separacao.itens.map(it=>({ativo:it.ativo, patrimonio:it.patrimonio||""})));
    if(p.extras) itensCandidatos.push(...p.extras.map(ex=>({ativo:ex.ativo, patrimonio:ex.patrimonio||""})));
    (p.trocas||[]).forEach(t=>{
      itensCandidatos.push({ativo:t.ativoOriginal, patrimonio:t.patrimonioOriginal||""});
      if(t.patrimonioNovo) itensCandidatos.push({ativo:t.ativoNovo, patrimonio:t.patrimonioNovo});
    });
    itensCandidatos.forEach(it=>{
      if(ativo && it.ativo!==ativo) return;
      if(patrimonioBusca && !(it.patrimonio||"").toLowerCase().includes(patrimonioBusca)) return;
      resultados.push({p, ativo:it.ativo, patrimonio:it.patrimonio});
    });
  });
  const seen = new Set();
  const dedupe = [];
  resultados.forEach(r=>{
    const key = r.p.id+"|"+r.ativo+"|"+r.patrimonio;
    if(seen.has(key)) return;
    seen.add(key);
    dedupe.push(r);
  });
  return dedupe.sort((a,b)=> (b.p.dataEntrega||"").localeCompare(a.p.dataEntrega||""));
}

          </div>

function bindBuscaEvents(){
  const input = document.getElementById("busca-input");
  const btn = document.getElementById("busca-btn");
  const executar = ()=>{ BUSCA_TERMO = input.value; BUSCA_ULTIMO_FOCO = "busca-input"; render(); };
  if(btn) btn.onclick = executar;
  if(input){
    input.addEventListener("input", ()=>{
      clearTimeout(BUSCA_DEBOUNCE_TIMER);
      BUSCA_DEBOUNCE_TIMER = setTimeout(executar, 350);
    });
    input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ clearTimeout(BUSCA_DEBOUNCE_TIMER); executar(); } });
  }
  document.querySelectorAll("[data-abrirbusca]").forEach(b=>{
    b.onclick = async ()=>{
      const tela = b.dataset.tela;
      VIEW = tela;
      ACTIVE_PEDIDO_ID = (tela!=="pedidos" && tela!=="historico") ? b.dataset.abrirbusca : null;
      if(tela==="recolhas" && ACTIVE_PEDIDO_ID){
        const p = DATA.pedidos.find(x=>x.id===ACTIVE_PEDIDO_ID);
        if(p && reconciliarRecolha(p)) await persist();
      }
      render();
    };
  });
  const aplicarBuscaAtivo = (focoId)=>{
    BUSCA_ATIVO_FILTRO = {
      ativo: document.getElementById("busca-ativo-tipo").value,
      patrimonio: document.getElementById("busca-ativo-patr").value,
      inicio: document.getElementById("busca-ativo-inicio").value,
      fim: document.getElementById("busca-ativo-fim").value
    };
    BUSCA_ULTIMO_FOCO = focoId || null;
    render();
  };
  const tipoAtivo = document.getElementById("busca-ativo-tipo");
  if(tipoAtivo) tipoAtivo.addEventListener("change", ()=>aplicarBuscaAtivo("busca-ativo-tipo"));
  const patrAtivo = document.getElementById("busca-ativo-patr");
  if(patrAtivo){
    patrAtivo.addEventListener("input", ()=>{
      clearTimeout(BUSCA_ATIVO_DEBOUNCE_TIMER);
      BUSCA_ATIVO_DEBOUNCE_TIMER = setTimeout(()=>aplicarBuscaAtivo("busca-ativo-patr"), 350);
    });
  }
  const inicioAtivo = document.getElementById("busca-ativo-inicio");
  if(inicioAtivo) inicioAtivo.addEventListener("change", ()=>aplicarBuscaAtivo("busca-ativo-inicio"));
  const fimAtivo = document.getElementById("busca-ativo-fim");
  if(fimAtivo) fimAtivo.addEventListener("change", ()=>aplicarBuscaAtivo("busca-ativo-fim"));
  const limparAtivo = document.getElementById("busca-ativo-limpar");
  if(limparAtivo) limparAtivo.onclick = ()=>{ BUSCA_ATIVO_FILTRO = {ativo:"",patrimonio:"",inicio:"",fim:""}; BUSCA_ULTIMO_FOCO = null; render(); };

  const idParaFocar = BUSCA_ULTIMO_FOCO || "busca-input";
  const elFoco = document.getElementById(idParaFocar);
  if(elFoco){
    elFoco.focus();
    if(elFoco.setSelectionRange && (elFoco.type==="text")) elFoco.setSelectionRange(elFoco.value.length, elFoco.value.length);
  }
}

function todosItensRecolhidos(p){
  return p.recolha && p.recolha.itens && p.recolha.itens.length>0 && p.recolha.itens.every(i=>i.recolhido);
}
function renderDashboard(){
  const ativos = pedidosAtivos();
  const aguardando = ativos.filter(p=>p.status==="AGUARDANDO_SEPARACAO");
  const liberados = ativos.filter(p=>p.status==="LIBERADO_PARA_ENTREGA");
  const recolhaPendente = ativos.filter(p=>p.status==="RECOLHAS_PENDENTES" && !todosItensRecolhidos(p));
  const pendenciaBeer = ativos.filter(p=>p.status==="RECOLHAS_PENDENTES" && todosItensRecolhidos(p) && !(p.recolha && p.recolha.retornadoBeerSales));
  const extrasPendentesVinculo = DATA.pedidos.reduce((s,p)=> s + (p.extras||[]).filter(ex=>!ex.vinculado).length, 0);
  const [fri, sat, sun] = nextWeekendDates();
  const diaSemanaHoje = new Date().getDay();
  const estamosNoFimDeSemana = diaSemanaHoje===5 || diaSemanaHoje===6 || diaSemanaHoje===0;
  const rotuloFimDeSemana = estamosNoFimDeSemana ? "Deste fim de semana" : "Próximo fim de semana";
  const aindaNaoEntregues = ativos.filter(p=> p.status==="AGUARDANDO_SEPARACAO" || p.status==="LIBERADO_PARA_ENTREGA");
  const hojeLista = aindaNaoEntregues.filter(p=> p.dataEntrega===todayISO());
  const amanhaLista = aindaNaoEntregues.filter(p=> p.dataEntrega===tomorrowISO());
  const fimDeSemana = aindaNaoEntregues.filter(p=> (p.dataEntrega===fri || p.dataEntrega===sat || p.dataEntrega===sun) && p.dataEntrega!==todayISO() && p.dataEntrega!==tomorrowISO());

  function statusBadge(p){
    if(p.status==="AGUARDANDO_SEPARACAO") return `<span class="badge badge-aguardando">Aguardando separação</span>`;
    if(p.status==="LIBERADO_PARA_ENTREGA") return `<span class="badge badge-liberado">Liberado para entrega</span>`;
    if(p.status==="RECOLHAS_PENDENTES") return `<span class="badge badge-recolha">Recolha pendente</span>`;
    if(p.status==="CONCLUIDO") return `<span class="badge badge-concluido">Concluído</span>`;
    return "";
  }
  function actionBtn(p){
    if(p.status==="AGUARDANDO_SEPARACAO") return `<button class="btn btn-amber btn-sm" data-goto="separacao" data-id="${p.id}">${ic('package')}Aguardando separação</button>`;
    if(p.status==="LIBERADO_PARA_ENTREGA") return `<button class="btn btn-hop btn-sm" data-goto="entrega" data-id="${p.id}">${ic('truck-delivery')}${p.rota?'Em rota':'Liberado p/ entrega'}</button>`;
    if(p.status==="RECOLHAS_PENDENTES") return `<button class="btn btn-alert btn-sm" data-goto="recolhas" data-id="${p.id}">${ic('arrow-back-up')}Recolha pendente</button>`;
    return "";
  }
  function renderList(list, emptyMsg){
    if(list.length===0) return `<div class="empty-state"><i>${emptyMsg}</i></div>`;
    return list.map(p=>`
      <div class="card">
        <div class="card-row">
          <div>
            <h3>Pedido #${escapeHtml(p.numero)} — ${escapeHtml(p.cliente)}</h3>
            <div class="meta">${escapeHtml(p.cidade)} · Entrega ${fmtDate(p.dataEntrega)} ${p.horarioEntrega||""} · Recolha prevista ${fmtDate(p.dataRecolhaPrevista)}
              ${p.quemRetira ? (' · Retira/recebe: <b>'+escapeHtml(p.quemRetira)+'</b>') : ''}
              ${p.foraFluxo ? '<span class="badge badge-fim" style="margin-left:8px;">PEDIDO FORA FLUXO</span>' : ''}
              ${p.coletaEmpresa ? '<span class="badge badge-liberado" style="margin-left:8px;">CLIENTE RETIRA NA EMPRESA</span>' : ''}
              ${p.devolveEmpresa ? '<span class="badge badge-liberado" style="margin-left:8px;">CLIENTE DEVOLVE NA EMPRESA</span>' : ''}
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            ${statusBadge(p)}
            ${actionBtn(p)}
          </div>
        </div>
      </div>`).join("");
  }

  return `
    <div class="kpi-grid">
      <button class="kpi-btn" data-goto="separacao">
        <div class="num">${aguardando.length}</div><div class="label">${ic('package')}Aguardando separação</div></button>
      <button class="kpi-btn hop" data-goto="entrega">
        <div class="num">${liberados.length}</div><div class="label">${ic('truck-delivery')}Liberado p/ entrega</div></button>
      <button class="kpi-btn alert" data-goto="recolhas">
        <div class="num">${recolhaPendente.length}</div><div class="label">${ic('arrow-back-up')}Recolhas pendentes</div></button>
      <button class="kpi-btn alert" data-goto="recolhas" data-filtro="beer">

      ${extrasPendentesVinculo>0 ? `<button class="kpi-btn alert" data-goto="extraspendentes"><div class="num">${extrasPendentesVinculo}</div><div class="label">${ic('link')}Extra(s) sem vínculo</div></button>` : ''}
      <div class="kpi"><div class="num">${fimDeSemana.length}</div><div class="label">${ic('calendar')}${rotuloFimDeSemana}</div></div>
    </div>

    ${hojeLista.length ? `
    <div class="section-title"><h2>Hoje (${fmtDate(todayISO())})</h2></div>
    ${renderList(hojeLista)}

    ${amanhaLista.length ? `
    <div class="section-title"><h2>Amanhã (${fmtDate(tomorrowISO())})</h2></div>
    ${renderList(amanhaLista)}
    ` : ''}

    ${fimDeSemana.length ? `
    <div class="section-title"><h2>${rotuloFimDeSemana} (${fmtDate(fri)} — ${fmtDate(sun)})</h2></div>
    ${renderList(fimDeSemana)}

    ${(!hojeLista.length && !amanhaLista.length && !fimDeSemana.length) ? `
    <div class="empty-state"><i>Nenhum pedido a entregar até o próximo fim de semana. Pra ver pedidos mais à frente, vá em Pedidos Agendados.</i></div>
    ` : ''}
  `;
}

function renderItemRowSimple(it, idx){

      <button type="button" class="remove-item" title="Remover">${ic('trash')}</button>

function bindNovoPedidoEvents(){
  const container = document.getElementById("itens-container");
  document.getElementById("f-telefone").addEventListener("input", e=>{
    e.target.value = maskPhone(e.target.value);
  });
  const isEditando = !!EDITING_PEDIDO_ID;
  document.getElementById("f-cliente").addEventListener("change", e=>{
    if(isEditando) return;
    const nomeDigitado = e.target.value.trim().toLowerCase();
    if(!nomeDigitado) return;
    const pedidosDoCliente = DATA.pedidos.filter(p=> (p.cliente||"").trim().toLowerCase()===nomeDigitado && p.status!=="EXCLUIDO")
      .sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""));
    if(pedidosDoCliente.length===0) return;
    const ultimo = pedidosDoCliente[0];
    document.getElementById("f-cidade").value = ultimo.cidade||"";
    document.getElementById("f-endereco").value = ultimo.endereco||"";
    if(ultimo.telefone) document.getElementById("f-telefone").value = ultimo.telefone;
    alertModal("Dados preenchidos automaticamente com base no último pedido desse cliente (#"+ultimo.numero+"). Pode ajustar qualquer campo antes de salvar.");
  });
  document.getElementById("toggle-forafluxo").onclick = e=>{
    NOVO_PEDIDO_STATE.foraFluxo = !NOVO_PEDIDO_STATE.foraFluxo;
    e.target.classList.toggle("on");
  };
  document.getElementById("add-item-btn").onclick = ()=>{
    syncFormFromDom();
    NOVO_PEDIDO_STATE.itensPedido.push({id:uid(), ativo:ATIVOS[0], quantidade:1});
    render();
  };
  container.querySelectorAll(".remove-item").forEach(btn=>{
    btn.onclick = ()=>{
      syncFormFromDom();
      const idx = parseInt(btn.closest(".item-row").dataset.idx);
      NOVO_PEDIDO_STATE.itensPedido.splice(idx,1);
      if(NOVO_PEDIDO_STATE.itensPedido.length===0) NOVO_PEDIDO_STATE.itensPedido.push({id:uid(),ativo:ATIVOS[0],quantidade:1});
      render();
    };
  });
  const outrosContainer = document.getElementById("outros-container");
  const addOutroBtn = document.getElementById("add-outro-btn");
  if(addOutroBtn) addOutroBtn.onclick = ()=>{
    syncFormFromDom();
    if(!NOVO_PEDIDO_STATE.outrosItens) NOVO_PEDIDO_STATE.outrosItens = [];
    NOVO_PEDIDO_STATE.outrosItens.push({descricao:"", quantidade:1});
    render();
  };
  if(outrosContainer) outrosContainer.querySelectorAll(".remove-item").forEach(btn=>{
    btn.onclick = ()=>{
      syncFormFromDom();
      const idx = parseInt(btn.closest(".item-row").dataset.idx);
      NOVO_PEDIDO_STATE.outrosItens.splice(idx,1);
      render();
    };
  });
  document.getElementById("save-pedido-btn").onclick = salvarPedido;
  const cancelBtn = document.getElementById("cancel-edit-btn");
  if(cancelBtn) cancelBtn.onclick = ()=>{ EDITING_PEDIDO_ID=null; NOVO_PEDIDO_STATE=null; VINCULO_PENDENTE=null; VIEW=(EDITING_RETURN_VIEW||"pedidos"); EDITING_RETURN_VIEW=null; render(); };
  const vincJaSim = document.getElementById("vinc-ja-sim");
  if(vincJaSim) vincJaSim.onclick = ()=>{ VINCULO_PENDENTE.jaRecolhido = true; render(); };
  const vincJaNao = document.getElementById("vinc-ja-nao");
  if(vincJaNao) vincJaNao.onclick = ()=>{ VINCULO_PENDENTE.jaRecolhido = false; render(); };
}
function syncItensFromDom(){
  const rows = document.querySelectorAll("#itens-container .item-row");
  rows.forEach((row,idx)=>{
    NOVO_PEDIDO_STATE.itensPedido[idx].ativo = row.querySelector(".item-ativo").value;
    NOVO_PEDIDO_STATE.itensPedido[idx].quantidade = parseInt(row.querySelector(".item-qtd").value)||1;
    const patrInput = row.querySelector(".item-patrimonio");
    if(patrInput) NOVO_PEDIDO_STATE.itensPedido[idx].patrimonio = patrInput.value.trim();
  });
}
function syncOutrosFromDom(){
  const rows = document.querySelectorAll("#outros-container .item-row");
  if(!NOVO_PEDIDO_STATE.outrosItens) NOVO_PEDIDO_STATE.outrosItens = [];
  rows.forEach((row,idx)=>{
    if(!NOVO_PEDIDO_STATE.outrosItens[idx]) return;
    NOVO_PEDIDO_STATE.outrosItens[idx].descricao = row.querySelector(".outro-desc").value.trim();
    NOVO_PEDIDO_STATE.outrosItens[idx].quantidade = parseInt(row.querySelector(".outro-qtd").value)||1;
  });
}
function syncFormFromDom(){
  const s = NOVO_PEDIDO_STATE;
  s.numero = document.getElementById("f-numero").value.trim();
  s.cliente = document.getElementById("f-cliente").value.trim();
  s.cidade = document.getElementById("f-cidade").value.trim();
  s.endereco = document.getElementById("f-endereco").value.trim();
  s.telefone = document.getElementById("f-telefone").value.trim();
  s.quemRetira = document.getElementById("f-quemretira").value.trim();
  s.usuarioPedido = document.getElementById("f-usuario").value.trim();
  s.dataEntrega = document.getElementById("f-dataentrega").value;
  s.horarioEntrega = document.getElementById("f-horaentrega").value;
  s.dataRecolhaPrevista = document.getElementById("f-datarecolha").value;
  s.coletaEmpresa = document.getElementById("f-coleta").checked;
  s.devolveEmpresa = document.getElementById("f-devolve").checked;
  const valorTxt = document.getElementById("f-valor").value.trim();
  s.valor = valorTxt ? parseValorBR(valorTxt) : null;
  syncItensFromDom();
  syncOutrosFromDom();
}
function maskPhone(v){
  v = v.replace(/\D/g,"").slice(0,11);
  let out = v;
  if(v.length>0) out = "("+v.slice(0,2);
  if(v.length>=3) out += ") "+v.slice(2,3);
  if(v.length>=4) out += " "+v.slice(3,7);
  if(v.length>=8) out += "-"+v.slice(7,11);
  return out;
}
async function salvarPedido(){
  const btnSalvar = document.getElementById("save-pedido-btn");
  if(btnSalvar && btnSalvar.disabled) return;
  if(btnSalvar) btnSalvar.disabled = true;
  try{
  syncItensFromDom();
  syncOutrosFromDom();
  const s = NOVO_PEDIDO_STATE;
  s.numero = document.getElementById("f-numero").value.trim();
  s.cliente = document.getElementById("f-cliente").value.trim();
  s.cidade = document.getElementById("f-cidade").value.trim();
  s.endereco = document.getElementById("f-endereco").value.trim();
  s.telefone = document.getElementById("f-telefone").value.trim();
  s.quemRetira = document.getElementById("f-quemretira").value.trim();
  s.usuarioPedido = document.getElementById("f-usuario").value.trim();
  s.dataEntrega = document.getElementById("f-dataentrega").value;
  s.horarioEntrega = document.getElementById("f-horaentrega").value;
  s.dataRecolhaPrevista = document.getElementById("f-datarecolha").value;
  s.coletaEmpresa = document.getElementById("f-coleta").checked;
  s.devolveEmpresa = document.getElementById("f-devolve").checked;
  const valorTxt2 = document.getElementById("f-valor").value.trim();
  s.valor = valorTxt2 ? parseValorBR(valorTxt2) : null;

  if(!s.cliente){ await alertModal("Informe o nome do cliente."); if(btnSalvar) btnSalvar.disabled = false; return; }
  if(!s.dataEntrega){ await alertModal("Informe a data de entrega."); if(btnSalvar) btnSalvar.disabled = false; return; }
  if(VINCULO_PENDENTE && VINCULO_PENDENTE.jaRecolhido===null){ await alertModal("Responda se os itens já foram recolhidos do cliente antes de salvar."); if(btnSalvar) btnSalvar.disabled = false; return; }

  const isEdit = !!EDITING_PEDIDO_ID;
  if(VINCULO_PENDENTE && !isEdit){
    const agora = new Date().toISOString();
    const itensComPatr = s.itensPedido.map(it=>({ativo:it.ativo, quantidade:it.quantidade, patrimonio:it.patrimonio||""}));
    s.separacao = {usuarioSeparacao: SESSION.nome||SESSION.username, itens: itensComPatr, data: agora};
    s.entrega = {entreguePor: SESSION.nome||SESSION.username, horarioChegada: s.horarioEntrega||"", entregaConcluida:true, dataConclusao: agora};
    s.rota = {saiuEm: agora, saiuPor: SESSION.nome||SESSION.username};
    s.recolha = {itens: itensComPatr.map(it=>({ativo:it.ativo, patrimonio:it.patrimonio, recolhido: VINCULO_PENDENTE.jaRecolhido===true})), retornadoBeerSales:false};
    if(VINCULO_PENDENTE.jaRecolhido===true){ s.recolha.dataRecolhaReal = agora; s.recolha.recolhidoPor = SESSION.nome||SESSION.username; }
    s.status = "RECOLHAS_PENDENTES";
  }
  if(isEdit){
    const idx = DATA.pedidos.findIndex(p=>p.id===EDITING_PEDIDO_ID);
    const original = DATA.pedidos[idx];
    s.historicoEdicoes = original.historicoEdicoes || [];
    s.historicoEdicoes.push({data:new Date().toISOString(), usuario:SESSION.nome||SESSION.username, alteracoes:"Dados do pedido atualizados."});
    DATA.pedidos[idx] = s;
  } else {
    DATA.pedidos.push(s);
  }
  await persist();
  if(!isEdit && VINCULO_PENDENTE){
    await vincularExtraENovoPedido(VINCULO_PENDENTE.pedidoOrigemId, VINCULO_PENDENTE.idxsExtras, s.numero, s.id);
    VINCULO_PENDENTE = null;
    await alertModal(`Pedido #${s.numero} criado e já vinculado como destino dos extras.`);
  } else if(isEdit){
    await alertModal("Registro alterado com sucesso.");
  } else {
    await alertModal("Registro salvo com sucesso.");
  }
  EDITING_PEDIDO_ID = null;
  NOVO_PEDIDO_STATE = null;
  VIEW = isEdit ? (EDITING_RETURN_VIEW || "pedidos") : "dashboard";
  EDITING_RETURN_VIEW = null;
  render();
  }catch(e){
    console.error("Erro ao salvar pedido", e);
    await alertModal("Ocorreu um erro inesperado ao salvar. Nada foi perdido no formulário — tente clicar em salvar de novo. Se persistir, avise o suporte com esta mensagem: "+e.message);
    if(btnSalvar) btnSalvar.disabled = false;
  }
}

function renderPedidosAgendados(){
  const list = DATA.pedidos.filter(p=> p.status==="AGUARDANDO_SEPARACAO" || p.status==="LIBERADO_PARA_ENTREGA")
    .sort((a,b)=> (a.dataEntrega||"9999-99-99").localeCompare(b.dataEntrega||"9999-99-99"));
  function statusBadge(p){
    if(p.status==="AGUARDANDO_SEPARACAO") return `<span class="badge badge-aguardando">Aguardando separação</span>`;
    if(p.status==="LIBERADO_PARA_ENTREGA") return `<span class="badge badge-liberado">Liberado p/ entrega</span>`;
    if(p.status==="RECOLHAS_PENDENTES") return `<span class="badge badge-recolha">Recolha pendente</span>`;
    return "";
  }
  if(list.length===0) return `<div class="empty-state"><i>Nenhum pedido aguardando separação ou entrega no momento. Pedidos já entregues ficam em Recolhas Pendentes; concluídos e cancelados, em Histórico.</i></div>`;
  return `
    <div class="section-title"><h2>Pedidos agendados</h2><span>${list.length} pedido(s) aguardando entrega</span></div>
    ${list.map(p=>`
      <div class="card">
        <div class="card-row">
          <div>
            <h3>#${escapeHtml(p.numero)} — ${escapeHtml(p.cliente)} ${p.importadoBeerSales?'<span class="badge badge-parcial">Importado</span>':''}</h3>
            <div class="meta">${escapeHtml(p.cidade)} · Entrega ${fmtDate(p.dataEntrega)} · Criado por ${escapeHtml(p.criadoPor)} em ${fmtDateTime(p.criadoEm)}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            ${statusBadge(p)}
            <button class="btn btn-ghost btn-sm" data-alterar="${p.id}">${ic('edit')}Alterar pedido</button>
            <button class="btn btn-alert btn-sm" data-excluir="${p.id}">${ic('trash')}Cancelar</button>
            <button class="btn btn-ghost btn-sm" data-excluirdefinitivo="${p.id}" title="Remove de vez, sem passar pelo Histórico">${ic('trash-x')}Excluir de vez</button>
          </div>
        </div>
        ${p.historicoEdicoes && p.historicoEdicoes.length ? `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12px;color:var(--foam-dim);">Histórico de edições (${p.historicoEdicoes.length})</summary>
          ${p.historicoEdicoes.slice().reverse().map(h=>`<div class="hist-entry"><b>${fmtDateTime(h.data)}</b> — ${escapeHtml(h.usuario)}: ${escapeHtml(h.alteracoes)}</div>`).join("")}
        </details>` : ''}
      </div>
    `).join("")}
  `;
}
let HISTORICO_FILTRO = {entreguePor:"", recolhidoPor:"", inicio:"", fim:""};
function renderHistoricoPedidos(){
  const listaBase = DATA.pedidos.filter(p=> p.status==="CONCLUIDO" || p.status==="EXCLUIDO");

  if(HISTORICO_FILTRO.recolhidoPor) list = list.filter(p=>(p.recolha?.recolhidoPor||"").toLowerCase()===HISTORICO_FILTRO.recolhidoPor.toLowerCase());

async function excluirPedidoDefinitivamente(pedidoId){
  const p = DATA.pedidos.find(x=>x.id===pedidoId);
  if(!p) return;
  const confirmar = await promptModal(
    "Excluir pedido definitivamente?",
    `#${p.numero} — ${p.cliente}. Isso remove o pedido de vez, de qualquer etapa (diferente de "Cancelar", que mantém no Histórico). Não tem volta. Digite EXCLUIR para confirmar.`
  );
  if(!confirmar || confirmar.trim().toUpperCase()!=="EXCLUIR"){
    if(confirmar!==null) await alertModal('Confirmação incorreta — era preciso digitar exatamente "EXCLUIR". Nada foi apagado.');
    return;
  }
  DATA.pedidos = DATA.pedidos.filter(x=>x.id!==pedidoId);
  await persist(1, {forceOverwrite:true});
  ACTIVE_PEDIDO_ID = null;
  render();
  await alertModal(`Pedido #${p.numero} excluído definitivamente.`);
}

let SEPARACAO_STATE = null;
function renderSeparacaoDetalhe(id){
  const p = DATA.pedidos.find(x=>x.id===id);
  if(!p) return `<div class="empty-state"><i>Pedido não encontrado.</i></div>`;
  if(!SEPARACAO_STATE || SEPARACAO_STATE.pedidoId!==id){
    if(p.separacao && p.separacao.itens && p.separacao.itens.length){
      const agrupado = {};
      p.separacao.itens.forEach(it=>{
        if(!agrupado[it.ativo]) agrupado[it.ativo] = {ativo:it.ativo, quantidade:0, patrimonios:[]};
        agrupado[it.ativo].quantidade += it.quantidade;
        agrupado[it.ativo].patrimonios.push(it.patrimonio||"");
      });
      SEPARACAO_STATE = { pedidoId:id, usuarioSeparacao: p.separacao.usuarioSeparacao||SESSION.nome||SESSION.username, itens: Object.values(agrupado) };
    } else {
      SEPARACAO_STATE = {
        pedidoId:id,
        usuarioSeparacao: SESSION.nome||SESSION.username,
        itens: p.itensPedido.map(it=>({ativo:it.ativo, quantidade:it.quantidade, patrimonios:Array(it.quantidade).fill("")}))
      };
    }
  }
  SEPARACAO_STATE.itens.forEach(it=>{
    if(!it.patrimonios) it.patrimonios = [];
    while(it.patrimonios.length < it.quantidade) it.patrimonios.push("");
    while(it.patrimonios.length > Math.max(it.quantidade,1)) it.patrimonios.pop();
  });
  return `
    <button class="btn btn-ghost btn-sm" id="voltar-lista">${ic("arrow-left")}Voltar</button>
    <div class="section-title"><h2>Separação — #${escapeHtml(p.numero)}</h2></div>
    <div class="card">
      <div class="meta">${escapeHtml(p.cliente)} · ${escapeHtml(p.cidade)} · ${escapeHtml(p.endereco)}<br>
      Entrega ${fmtDate(p.dataEntrega)} ${p.horarioEntrega||""} · Telefone ${escapeHtml(p.telefone)}
      ${p.foraFluxo ? '<br><span class="badge badge-fim" style="margin-top:6px;">PEDIDO FORA FLUXO</span>' : ''}
      </div>
      <hr class="divider">
      <div class="field" style="max-width:320px;"><label>Usuário responsável pela separação</label>
        <input type="text" id="sep-usuario" value="${escapeHtml(SEPARACAO_STATE.usuarioSeparacao)}"></div>
      <hr class="divider">
      <h3 style="margin-bottom:10px;">Ativos a separar <span class="meta">(ativos com patrimônio e mais de 1 unidade pedem um número pra cada)</span></h3>
      <div id="sep-itens">
        ${SEPARACAO_STATE.itens.map((it,idx)=>{
          const precisaPatr = ATIVOS_COM_PATRIMONIO.includes(it.ativo);
          return `
        <div class="item-row" data-idx="${idx}">
          <div class="field"><label>Ativo</label>
            <select class="sep-ativo">${ATIVOS.map(a=>`<option value="${a}" ${a===it.ativo?'selected':''}>${a}</option>`).join("")}</select>
          </div>
          <div class="field"><label>Quantidade</label><input type="text" class="sep-qtd" value="${it.quantidade}"></div>
          <div class="field">
            <label>Nº patrimônio ${precisaPatr?'<span class="chip-required">*</span> (um por unidade)':'(opcional)'}</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${it.patrimonios.map((patr,pidx)=>`<input type="text" class="sep-patrimonio-multi" data-pidx="${pidx}" value="${escapeHtml(patr)}" placeholder="${precisaPatr?('Unid. '+(pidx+1)):'Ex: 0074'}" style="width:105px;background:var(--bg-deep);border:1px solid var(--line);color:var(--foam);padding:8px 10px;border-radius:6px;font-size:13px;">`).join("")}
            </div>
          </div>
          <button type="button" class="remove-item">${ic('trash')}</button>
        </div>`;
        }).join("")}
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="sep-add-item">${ic('plus')}Adicionar ativo</button>
      <hr class="divider">
      <button class="btn btn-amber" id="sep-salvar">${ic('check')}Concluir separação e liberar para entrega</button>
    </div>
  `;
}
function bindSeparacaoEvents(){
  const voltar = document.getElementById("voltar-lista");
  if(voltar) voltar.onclick = ()=>{ ACTIVE_PEDIDO_ID=null; SEPARACAO_STATE=null; render(); };
  document.querySelectorAll("[data-abrir]").forEach(btn=>{
    btn.onclick = ()=>{ ACTIVE_PEDIDO_ID = btn.dataset.abrir; SEPARACAO_STATE=null; render(); };
  });
  const addBtn = document.getElementById("sep-add-item");
  if(addBtn) addBtn.onclick = ()=>{
    syncSeparacaoFromDom();
    SEPARACAO_STATE.itens.push({ativo:ATIVOS[0], quantidade:1, patrimonios:[""]});
    render();
  };
  document.querySelectorAll("#sep-itens .remove-item").forEach(btn=>{
    btn.onclick = ()=>{
      syncSeparacaoFromDom();
      const idx = parseInt(btn.closest(".item-row").dataset.idx);
      SEPARACAO_STATE.itens.splice(idx,1);
      render();
    };
  });
  document.querySelectorAll("#sep-itens .sep-qtd, #sep-itens .sep-ativo").forEach(el=>{
    el.addEventListener("change", ()=>{ syncSeparacaoFromDom(); render(); });
  });
  const salvarBtn = document.getElementById("sep-salvar");
  if(salvarBtn) salvarBtn.onclick = salvarSeparacao;
}
function syncSeparacaoFromDom(){
  const rows = document.querySelectorAll("#sep-itens .item-row");
  rows.forEach((row,idx)=>{
    SEPARACAO_STATE.itens[idx].ativo = row.querySelector(".sep-ativo").value;
    SEPARACAO_STATE.itens[idx].quantidade = parseInt(row.querySelector(".sep-qtd").value)||1;
    const patrInputs = row.querySelectorAll(".sep-patrimonio-multi");
    SEPARACAO_STATE.itens[idx].patrimonios = Array.from(patrInputs).map(inp=>inp.value.trim());
  });
}
async function salvarSeparacao(){
  try{
  syncSeparacaoFromDom();
  const usuario = document.getElementById("sep-usuario").value.trim();

  // Expande cada unidade com patrimônio próprio em uma linha separada
  const itensExpandidos = [];
  for(const it of SEPARACAO_STATE.itens){
    const precisaPatr = ATIVOS_COM_PATRIMONIO.includes(it.ativo);
    if(precisaPatr){
      for(let i=0;i<it.quantidade;i++){
        const patr = (it.patrimonios[i]||"").trim();
        if(!patr){ await alertModal("Informe o número de patrimônio de todas as unidades de: "+it.ativo); return; }
        itensExpandidos.push({ativo:it.ativo, quantidade:1, patrimonio:patr});
      }
    } else {
      itensExpandidos.push({ativo:it.ativo, quantidade:it.quantidade, patrimonio:(it.patrimonios[0]||"").trim()});
    }
  }

  for(const it of itensExpandidos){
    if(it.patrimonio){
      const conflito = patrimonioEmUsoPor(it.ativo, it.patrimonio, SEPARACAO_STATE.pedidoId);
      if(conflito){
        await alertModal("O patrimônio "+it.patrimonio+" ("+it.ativo+") já está em uso no pedido "+conflito+". Verifique.");
        return;
      }
    }
  }
  const dupCheck = new Set();
  for(const it of itensExpandidos){
    if(!it.patrimonio) continue;
    const key = it.ativo+"|"+it.patrimonio.toLowerCase();
    if(dupCheck.has(key)){ await alertModal("Patrimônio "+it.patrimonio+" repetido na mesma separação."); return; }
    dupCheck.add(key);
  }
  const p = DATA.pedidos.find(x=>x.id===SEPARACAO_STATE.pedidoId);
  p.separacao = {usuarioSeparacao:usuario, itens:itensExpandidos, data:new Date().toISOString()};
  p.status = "LIBERADO_PARA_ENTREGA";
  await persist();
  ACTIVE_PEDIDO_ID=null; SEPARACAO_STATE=null; VIEW="dashboard";
  render();
  await alertModal("Separação salva com sucesso — pedido liberado para entrega.");
  }catch(e){
    console.error("Erro ao salvar separação", e);
    await alertModal("Ocorreu um erro inesperado ao salvar a separação. Tente novamente. Detalhe técnico: "+e.message);
  }
}

function abrirModalVincular(pedidoOrigemId, idxsExtras){
  return new Promise(resolve=>{
    const p = DATA.pedidos.find(x=>x.id===pedidoOrigemId);
    const itensResumo = idxsExtras.map(i=>p.extras[i]).map(ex=>`${ex.quantidade}x ${ex.ativo}`).join(", ");
    openModal(`
      <h3 style="font-size:15px;margin-bottom:6px;color:var(--foam);text-transform:none;">Vincular a um novo pedido</h3>
      <p class="meta" style="margin-bottom:14px;">Itens: ${escapeHtml(itensResumo)}</p>
      <button class="btn btn-amber btn-sm" id="vinc-criar-novo" style="width:100%;margin-bottom:10px;">${ic('plus')}Ainda não existe — criar pedido novo com esses itens</button>
      <button class="btn btn-ghost btn-sm" id="vinc-usar-existente" style="width:100%;margin-bottom:14px;">${ic('link')}Já existe — escolher o pedido</button>
      <div id="vinc-existente-area" style="display:none;">
        <div class="field" style="margin-bottom:10px;"><label>Escolha o pedido</label>
          <select id="vinc-select-existente">
            <option value="">Selecione...</option>
            ${DATA.pedidos.filter(pp=>pp.id!==pedidoOrigemId).sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||"")).map(pp=>`<option value="${pp.id}">#${escapeHtml(pp.numero)} — ${escapeHtml(pp.cliente)}</option>`).join("")}
          </select>
        </div>
        <button class="btn btn-amber btn-sm" id="vinc-confirmar-existente" style="width:100%;">${ic('check')}Vincular a esse pedido</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="vinc-cancelar" style="width:100%;margin-top:10px;">${ic('x')}Cancelar</button>
    `);
    document.getElementById("vinc-cancelar").onclick = ()=>{ closeModalIfAny(); resolve(false); };
    document.getElementById("vinc-usar-existente").onclick = ()=>{
      document.getElementById("vinc-existente-area").style.display = "block";
    };
    document.getElementById("vinc-criar-novo").onclick = ()=>{
      closeModalIfAny();
      VINCULO_PENDENTE = {pedidoOrigemId, idxsExtras, jaRecolhido:null};
      const itensNovoPedido = idxsExtras.map(i=>({id:uid(), ativo:p.extras[i].ativo, quantidade:p.extras[i].quantidade||1, patrimonio:p.extras[i].patrimonio||""}));
      NOVO_PEDIDO_STATE = blankPedido();
      NOVO_PEDIDO_STATE.cliente = p.cliente;
      NOVO_PEDIDO_STATE.cidade = p.cidade;
      NOVO_PEDIDO_STATE.endereco = p.endereco;
      NOVO_PEDIDO_STATE.telefone = p.telefone;
      NOVO_PEDIDO_STATE.itensPedido = itensNovoPedido;
      EDITING_PEDIDO_ID = null;
      VIEW = "novopedido";
      resolve(true);
    };
    document.getElementById("vinc-confirmar-existente").onclick = async ()=>{
      const idPedido = document.getElementById("vinc-select-existente").value;
      if(!idPedido) return;
      const pedidoExistente = DATA.pedidos.find(x=>x.id===idPedido);
      closeModalIfAny();
      await vincularExtraENovoPedido(pedidoOrigemId, idxsExtras, pedidoExistente.numero, pedidoExistente.id);
      resolve(true);
    };
  });
}
async function vincularExtraENovoPedido(pedidoOrigemId, idxsExtras, numeroVinculo, pedidoVinculadoId){
  const p = DATA.pedidos.find(x=>x.id===pedidoOrigemId);
  if(!p) return;
  const idxs = Array.isArray(idxsExtras) ? idxsExtras : [idxsExtras];
  idxs.forEach(idx=>{
    const ex = p.extras[idx];
    if(!ex) return;
    ex.vinculado = true;
    ex.numeroPedidoVinculado = numeroVinculo;
    ex.pedidoVinculadoId = pedidoVinculadoId || null;
    if(p.recolha && p.recolha.itens){
      const i = p.recolha.itens.findIndex(ri=>ri.ativo===ex.ativo && ri.patrimonio===ex.patrimonio);
      if(i!==-1) p.recolha.itens.splice(i,1);
    }
  });
  if(p.recolha && p.recolha.itens.length>0 && p.recolha.itens.every(i=>i.recolhido) && p.recolha.retornadoBeerSales && todosExtrasVinculados(p)){
    p.status = "CONCLUIDO";
  }
  await persist();
}

    <hr class="divider">

    ${extras.length ? extras.map((ex,idx)=>`<div class="hist-entry"><button class="remove-x-inline" data-remextra="${idx}" title="Excluir este extra">${ic('trash')}</button><b>${escapeHtml(ex.ativo)}</b> — Qtd ${ex.quantidade} — Patr. ${escapeHtml(ex.patrimonio)||'—'}

      <button class="btn btn-ghost btn-sm" data-moverorig="${idx}" style="margin-left:6px;" title="Na verdade fazia parte do pedido original">${ic('corner-up-left')}Mover p/ pedido original</button>
    </div>`).join("") : '<p class="meta">Nenhum ativo extra entregue neste pedido.</p>'}
    ${extras.filter(ex=>!ex.vinculado).length>1 ? `<button type="button" class="btn btn-amber btn-sm" id="vincular-todos-extras" style="margin-top:8px;">${ic('link')}Vincular todos os pendentes (${extras.filter(ex=>!ex.vinculado).length}) ao mesmo pedido</button>` : ''}

function bindPatrimonioEditavelEvents(pedidoId){
  const salvarPatr = document.getElementById("salvar-patrimonios");
  if(salvarPatr) salvarPatr.onclick = async ()=>{
    const p = DATA.pedidos.find(x=>x.id===pedidoId);
    const inputs = document.querySelectorAll(".patr-edit-input");
    const novos = [];
    inputs.forEach(inp=> novos.push(inp.value.trim()));
    const seen = new Set();
    for(let i=0;i<novos.length;i++){
      const it = p.separacao.itens[i];
      const val = novos[i];
      if(ATIVOS_COM_PATRIMONIO.includes(it.ativo) && !val){ await alertModal("Informe o patrimônio para: "+it.ativo); return; }
      if(val){
        const key = it.ativo+"|"+val.toLowerCase();
        if(seen.has(key)){ await alertModal("Patrimônio "+val+" repetido na lista."); return; }
        seen.add(key);
        const conflito = patrimonioEmUsoPor(it.ativo, val, p.id);
        if(conflito){ await alertModal("O patrimônio "+val+" já está em uso no pedido "+conflito+"."); return; }
      }
    }
    novos.forEach((val,i)=>{ p.separacao.itens[i].patrimonio = val; });
    await persist();
    await alertModal("Números de patrimônio atualizados.");
    render();
  };
}
function bindTrocaExtraEvents(pedidoId){
  const abrirTroca = document.getElementById("abrir-form-troca");
  if(abrirTroca) abrirTroca.onclick = ()=>{ TROCA_FORM_ABERTO = true; render(); };
  const fecharTroca = document.getElementById("fechar-form-troca");
  if(fecharTroca) fecharTroca.onclick = ()=>{ TROCA_FORM_ABERTO = false; render(); };
  const abrirExtra = document.getElementById("abrir-form-extra");
  if(abrirExtra) abrirExtra.onclick = ()=>{ EXTRA_FORM_ABERTO = true; render(); };
  const fecharExtra = document.getElementById("fechar-form-extra");
  if(fecharExtra) fecharExtra.onclick = ()=>{ EXTRA_FORM_ABERTO = false; render(); };

  document.querySelectorAll("[data-moverorig]").forEach(btn=>{
    btn.onclick = async ()=>{
      const p = DATA.pedidos.find(x=>x.id===pedidoId);
      const idx = parseInt(btn.dataset.moverorig);
      const ex = p.extras[idx];
      const confirmar = await promptModal("Mover para o pedido original?", `Isso remove "${ex.ativo} — Patr. ${ex.patrimonio||'—'}" da lista de extras e passa a tratar como parte do pedido original (sem pendência de vínculo). Digite MOVER para confirmar.`);
      if(!confirmar || confirmar.trim().toUpperCase()!=="MOVER"){ if(confirmar!==null) await alertModal('Confirmação incorreta — era preciso digitar exatamente "MOVER". Nada foi alterado.'); return; }
      p.extras.splice(idx,1);
      if(!p.separacao) p.separacao = {usuarioSeparacao:SESSION.nome||SESSION.username, itens:[], data:new Date().toISOString()};
      if(!p.separacao.itens) p.separacao.itens = [];
      p.separacao.itens.push({ativo:ex.ativo, quantidade:ex.quantidade||1, patrimonio:ex.patrimonio||""});
      await persist();
      render();
    };
  });
  document.querySelectorAll("[data-abrirvinculado]").forEach(btn=>{
    btn.onclick = ()=>{
      const destino = DATA.pedidos.find(x=>x.id===btn.dataset.abrirvinculado);
      if(!destino) return;
      VIEW = telaDoStatus(destino.status);
      ACTIVE_PEDIDO_ID = (VIEW!=="pedidos" && VIEW!=="historico") ? destino.id : null;
      render();
    };
  });
  const vincularTodos = document.getElementById("vincular-todos-extras");
  if(vincularTodos) vincularTodos.onclick = async ()=>{
    const p = DATA.pedidos.find(x=>x.id===pedidoId);
    const idxPendentes = p.extras.map((ex,idx)=>ex.vinculado?null:idx).filter(idx=>idx!==null);
    await abrirModalVincular(p.id, idxPendentes);
    render();
  };
  document.querySelectorAll("[data-vincularextra]").forEach(btn=>{
    btn.onclick = async ()=>{
      const p = DATA.pedidos.find(x=>x.id===pedidoId);
      const idx = parseInt(btn.dataset.vincularextra);
      await abrirModalVincular(p.id, [idx]);
      render();
    };
  });
  document.querySelectorAll("[data-remtroca]").forEach(btn=>{
    btn.onclick = async ()=>{
      const p = DATA.pedidos.find(x=>x.id===pedidoId);
      const idx = parseInt(btn.dataset.remtroca);
      const t = p.trocas[idx];
      const confirmar = await promptModal("Excluir esta troca?", 'Digite EXCLUIR para confirmar. Isso não desfaz a separação original automaticamente — confira os ativos pendentes de recolha depois.');
      if(!confirmar || confirmar.trim().toUpperCase()!=="EXCLUIR"){ if(confirmar!==null) await alertModal('Confirmação incorreta — era preciso digitar exatamente "EXCLUIR". Nada foi apagado.'); return; }
      p.trocas.splice(idx,1);
      if(p.recolha && p.recolha.itens){
        let iOrig = p.recolha.itens.findIndex(ri=>ri.ativo===t.ativoOriginal && ri.patrimonio===t.patrimonioOriginal);
        if(iOrig!==-1) p.recolha.itens.splice(iOrig,1);
        if(t.patrimonioNovo){
          let iNovo = p.recolha.itens.findIndex(ri=>ri.ativo===t.ativoNovo && ri.patrimonio===t.patrimonioNovo);
          if(iNovo!==-1) p.recolha.itens.splice(iNovo,1);
        }
      }
      await persist();
      render();
    };
  });
  document.querySelectorAll("[data-remextra]").forEach(btn=>{
    btn.onclick = async ()=>{
      const p = DATA.pedidos.find(x=>x.id===pedidoId);
      const idx = parseInt(btn.dataset.remextra);
      const ex = p.extras[idx];
      const confirmar = await promptModal("Excluir este extra?", 'Digite EXCLUIR para confirmar.');
      if(!confirmar || confirmar.trim().toUpperCase()!=="EXCLUIR"){ if(confirmar!==null) await alertModal('Confirmação incorreta — era preciso digitar exatamente "EXCLUIR". Nada foi apagado.'); return; }
      p.extras.splice(idx,1);
      if(p.recolha && p.recolha.itens){
        const i = p.recolha.itens.findIndex(ri=>ri.ativo===ex.ativo && ri.patrimonio===ex.patrimonio);
        if(i!==-1) p.recolha.itens.splice(i,1);
      }
      await persist();
      render();
    };
  });

  const addTroca = document.getElementById("add-troca");
  if(addTroca) addTroca.onclick = async ()=>{
    if(addTroca.disabled) return;
    addTroca.disabled = true;
    const p = DATA.pedidos.find(x=>x.id===pedidoId);
    const origemSelect = document.getElementById("troca-origem");
    const origemIdx = parseInt(origemSelect.value);
    const origem = p.separacao.itens[origemIdx];
    const ativoOrig = origem.ativo;
    const patrOrig = origem.patrimonio||"";
    const ativoNovo = document.getElementById("troca-ativonovo").value;
    const patrNovo = document.getElementById("troca-patrnovo").value.trim();
    const motivo = document.getElementById("troca-motivo").value.trim();
    const retornou = document.getElementById("troca-retornou").checked;
    if(!motivo){ await alertModal("Informe o motivo da troca."); addTroca.disabled=false; return; }
    if(patrNovo){
      const conflito = patrimonioEmUsoPor(ativoNovo, patrNovo, p.id);
      if(conflito){ await alertModal("O patrimônio "+patrNovo+" já está em uso no pedido "+conflito+"."); addTroca.disabled=false; return; }
    }
    if(!p.trocas) p.trocas=[];
    p.trocas.push({ativoOriginal:ativoOrig, patrimonioOriginal:patrOrig, ativoNovo, patrimonioNovo:patrNovo, motivo, retornouFabrica:retornou, data:new Date().toISOString()});
    origem._substituido = true;
    if(!p.recolha) p.recolha = {itens:[], retornadoBeerSales:false};
    p.recolha.itens.push({ativo:ativoOrig, patrimonio:patrOrig, recolhido:true});
    if(patrNovo) p.recolha.itens.push({ativo:ativoNovo, patrimonio:patrNovo, recolhido:false});
    if(p.recolha.retornadoBeerSales && patrNovo) p.recolha.retornadoBeerSales = false;
    TROCA_FORM_ABERTO = false;
    await persist();
    render();
  };
  const addExtra = document.getElementById("add-extra");
  if(addExtra) addExtra.onclick = async ()=>{
    if(addExtra.disabled) return;
    addExtra.disabled = true;
    const p = DATA.pedidos.find(x=>x.id===pedidoId);
    const ativo = document.getElementById("extra-ativo").value;
    const qtd = parseInt(document.getElementById("extra-qtd").value)||1;
    const patr = document.getElementById("extra-patr").value.trim();
    if(ATIVOS_COM_PATRIMONIO.includes(ativo) && patr){
      const conflito = patrimonioEmUsoPor(ativo, patr, p.id);
      if(conflito){ await alertModal("O patrimônio "+patr+" já está em uso no pedido "+conflito+"."); addExtra.disabled=false; return; }
    }
    if(!p.extras) p.extras=[];
    p.extras.push({ativo, quantidade:qtd, patrimonio:patr, vinculado:false, numeroPedidoVinculado:null});
    if(!p.recolha) p.recolha = {itens:[], retornadoBeerSales:false};
    p.recolha.itens.push({ativo, patrimonio:patr, recolhido:false});
    if(p.recolha.retornadoBeerSales) p.recolha.retornadoBeerSales = false;
    EXTRA_FORM_ABERTO = false;
    await persist();
    render();
  };
}
