function bindEntregaEvents(){
  const voltar = document.getElementById("voltar-lista");
  if(voltar) voltar.onclick = ()=>{ ACTIVE_PEDIDO_ID=null; ENTREGA_STATE=null; TROCA_FORM_ABERTO=false; EXTRA_FORM_ABERTO=false; render(); };
  document.querySelectorAll("[data-abrir]").forEach(btn=>{
    btn.onclick = ()=>{ ACTIVE_PEDIDO_ID = btn.dataset.abrir; ENTREGA_STATE=null; TROCA_FORM_ABERTO=false; EXTRA_FORM_ABERTO=false; render(); };
  });
  const saiu = document.getElementById("ent-saiu");
  if(saiu) saiu.onclick = async ()=>{
    const p = DATA.pedidos.find(x=>x.id===ENTREGA_STATE.pedidoId);
    p.rota = {saiuEm:new Date().toISOString(), saiuPor: SESSION.nome||SESSION.username};
    await persist();
    render();
  };
  bindPatrimonioEditavelEvents(ENTREGA_STATE.pedidoId);
  bindTrocaExtraEvents(ENTREGA_STATE.pedidoId);
  const concluir = document.getElementById("ent-concluir");
  if(concluir) concluir.onclick = async ()=>{
    try{
    const p = DATA.pedidos.find(x=>x.id===ENTREGA_STATE.pedidoId);
    if(!p.rota){ await alertModal("Registre que o entregador saiu para entrega antes de concluir."); return; }
    const entreguePor = document.getElementById("ent-entreguepor").value.trim();
    const horario = document.getElementById("ent-horario").value;
    if(!entreguePor || !horario){ await alertModal("Informe quem entregou e o horário de chegada."); return; }
    p.entrega = {entreguePor, horarioChegada:horario, entregaConcluida:true, dataConclusao:new Date().toISOString()};
    if(!p.recolha) p.recolha = {itens:[], retornadoBeerSales:false};
    (p.separacao?.itens||[]).forEach(it=>{
      if(it._substituido) return;
      const jaExiste = p.recolha.itens.some(ri=>ri.ativo===it.ativo && ri.patrimonio===it.patrimonio);
      if(!jaExiste) p.recolha.itens.push({ativo:it.ativo, patrimonio:it.patrimonio, recolhido:false});
    });
    p.status = "RECOLHAS_PENDENTES";
    await persist();
    ACTIVE_PEDIDO_ID=null; ENTREGA_STATE=null; TROCA_FORM_ABERTO=false; EXTRA_FORM_ABERTO=false; VIEW="dashboard";
    render();
    await alertModal("Entrega concluída com sucesso — pedido movido para Recolhas Pendentes.");
    }catch(e){
      console.error("Erro ao concluir entrega", e);
      await alertModal("Ocorreu um erro inesperado ao concluir a entrega. Tente novamente. Detalhe técnico: "+e.message);
    }
  };
  const cancelarVoltarEnt = document.getElementById("ent-cancelar-voltar");
  if(cancelarVoltarEnt) cancelarVoltarEnt.onclick = async ()=>{
    const p = DATA.pedidos.find(x=>x.id===ENTREGA_STATE.pedidoId);
    const confirmar = await promptModal("Cancelar e voltar para Aguardando Separação?", 'Digite VOLTAR para confirmar. O que já foi separado continua preenchido, só o status volta.');
    if(!confirmar || confirmar.trim().toUpperCase()!=="VOLTAR"){ if(confirmar!==null) await alertModal('Confirmação incorreta — era preciso digitar exatamente "VOLTAR". Nada foi alterado.'); return; }
    p.status = "AGUARDANDO_SEPARACAO";
    p.rota = null;
    if(!p.historicoEdicoes) p.historicoEdicoes = [];
    p.historicoEdicoes.push({data:new Date().toISOString(), usuario:SESSION.nome||SESSION.username, alteracoes:"Entrega cancelada, pedido voltou para Aguardando Separação."});
    await persist();
    ACTIVE_PEDIDO_ID=null; ENTREGA_STATE=null; VIEW="dashboard";
    render();
    await alertModal("Pedido voltou para Aguardando Separação.");
  };
}

function todosExtrasVinculados(p){
  return (p.extras||[]).every(ex=>ex.vinculado);
}
function reconciliarRecolha(p){
  if(!p.separacao) return false;
  if(!p.recolha) p.recolha = {itens:[], retornadoBeerSales:false};
  let mudou = false;
  (p.extras||[]).forEach(ex=>{
    if(!ex.vinculado) return;
    const i = p.recolha.itens.findIndex(ri=>ri.ativo===ex.ativo && ri.patrimonio===ex.patrimonio);
    if(i!==-1){ p.recolha.itens.splice(i,1); mudou = true; }
  });
  const existe = (ativo,patr)=> p.recolha.itens.some(ri=>ri.ativo===ativo && ri.patrimonio===patr);
  (p.separacao.itens||[]).forEach(it=>{
    if(it._substituido) return;
    if(!existe(it.ativo, it.patrimonio||"")){
      p.recolha.itens.push({ativo:it.ativo, patrimonio:it.patrimonio||"", recolhido:false});
      mudou = true;
    }
  });
  (p.trocas||[]).forEach(t=>{
    if(!existe(t.ativoOriginal, t.patrimonioOriginal||"")){
      p.recolha.itens.push({ativo:t.ativoOriginal, patrimonio:t.patrimonioOriginal||"", recolhido:true});
      mudou = true;
    }
    if(t.patrimonioNovo && !existe(t.ativoNovo, t.patrimonioNovo)){
      p.recolha.itens.push({ativo:t.ativoNovo, patrimonio:t.patrimonioNovo, recolhido:false});
      mudou = true;
    }
  });
  (p.extras||[]).forEach(ex=>{
    if(ex.vinculado) return;
    if(!existe(ex.ativo, ex.patrimonio||"")){
      p.recolha.itens.push({ativo:ex.ativo, patrimonio:ex.patrimonio||"", recolhido:false});
      mudou = true;
    }
  });
  return mudou;
}

function bindRecolhaEvents(){

      p.recolha.retornadoBeerSales = false;
    }
    const todos = p.recolha.itens.length>0 && p.recolha.itens.every(i=>i.recolhido);
    if(todos && p.recolha.retornadoBeerSales && todosExtrasVinculados(p)) p.status = "CONCLUIDO";

    render();
    await alertModal("Recolha salva com sucesso.");
    }catch(e){

      p.recolha.retornadoBeerSales = false;
    }
    if(p.recolha.retornadoBeerSales && p.recolha.itens.every(i=>i.recolhido) && todosExtrasVinculados(p)) p.status = "CONCLUIDO";
    await persist();

    if(!confirmar || confirmar.trim().toUpperCase()!=="VOLTAR"){ if(confirmar!==null) await alertModal('Confirmação incorreta — era preciso digitar exatamente "VOLTAR". Nada foi alterado.'); return; }

    VIEW = "entrega";
    render();
  };
  const excluirDefRec = document.getElementById("rec-excluirdefinitivo");
  if(excluirDefRec) excluirDefRec.onclick = ()=> excluirPedidoDefinitivamente(ACTIVE_PEDIDO_ID);
  const alterarCompletoRec = document.getElementById("rec-alterarcompleto");
  if(alterarCompletoRec) alterarCompletoRec.onclick = ()=>{
    EDITING_PEDIDO_ID = ACTIVE_PEDIDO_ID;
    EDITING_RETURN_VIEW = "recolhas";
    NOVO_PEDIDO_STATE = null;
    ACTIVE_PEDIDO_ID = null;
    VIEW = "novopedido";
    render();
  };
  const beerBtn = document.getElementById("rec-beersales");
  if(beerBtn) beerBtn.onclick = async ()=>{
    const p = DATA.pedidos.find(x=>x.id===ACTIVE_PEDIDO_ID);
    const todosRecolhidosAgora = p.recolha && p.recolha.itens.length>0 && p.recolha.itens.every(i=>i.recolhido);
    if(!todosRecolhidosAgora && SESSION.role!=="ADM" && !p.recolha.retornadoBeerSales){
      await alertModal("Marque todos os ativos como recolhidos antes de confirmar o retorno no BEER SALES.");
      return;
    }
    if(p.recolha.retornadoBeerSales){
      p.recolha.retornadoBeerSales = false;
      p.recolha.qtdConfirmadaBeer = 0;
      if(p.status==="CONCLUIDO") p.status = "RECOLHAS_PENDENTES";
      await persist();
      render();
      return;
    }
    const confirmar = await promptModal("Confirmar retorno no BEER SALES", 'Os ativos realmente voltaram fisicamente para a empresa? Digite SIM para confirmar.');
    if(!confirmar || confirmar.trim().toUpperCase()!=="SIM"){
      if(confirmar!==null) await alertModal('Confirmação incorreta — era preciso digitar "SIM". Nada foi alterado.');
      return;
    }
    p.recolha.retornadoBeerSales = true;
    p.recolha.qtdConfirmadaBeer = p.recolha.itens.filter(i=>i.recolhido).length;
    const todos = p.recolha.itens.length>0 && p.recolha.itens.every(i=>i.recolhido);
    if(todos && todosExtrasVinculados(p)) p.status = "CONCLUIDO";
    await persist();
    render();
  };
}

function formatDuracao(ms){
  if(ms<0) ms=0;
  const totalSeg = Math.floor(ms/1000);
  const h = Math.floor(totalSeg/3600);
  const m = Math.floor((totalSeg%3600)/60);
  const s = totalSeg%60;
  if(h>0) return h+"h "+m+"min";
  if(m>0) return m+"min "+s+"s";
  return s+"s";
}

    }

    render();
  };

function nextMonday(){
  const now = new Date(); now.setHours(0,0,0,0);
  const day = now.getDay();
  let offset = (1 - day + 7) % 7; if(offset===0) offset=7;
  const seg = new Date(now); seg.setDate(now.getDate()+offset);
  return seg.toISOString().slice(0,10);
}

function calcularLitros(p){
  const itens = p.itensPedido || (p.separacao?.itens) || [];
  let total = 0;
  itens.forEach(it=>{
    if(it.ativo==="BARRIL PILSEN 30L") total += (it.quantidade||0)*30;
    if(it.ativo==="BARRIL PILSEN 50L") total += (it.quantidade||0)*50;
  });
  return total;
}
function listaUnicaCaseInsensitive(valores){
  const map = new Map();
  valores.filter(Boolean).forEach(v=>{
    const chave = v.trim().toLowerCase();
    if(!map.has(chave)) map.set(chave, v.trim());
  });
  return [...map.values()].sort((a,b)=>a.localeCompare(b));
}

  const { cidadesOrdenadas, mesesOrdenados } = FINANCEIRO_DADOS_ATUAIS;

  if(GRAFICO_CIDADE){ GRAFICO_CIDADE.destroy(); GRAFICO_CIDADE=null; }
  if(GRAFICO_MES){ GRAFICO_MES.destroy(); GRAFICO_MES=null; }

  const canvasCidade = document.getElementById("grafico-cidade");
  if(canvasCidade && cidadesOrdenadas.length){
    GRAFICO_CIDADE = new Chart(canvasCidade, {
      type: "bar",
      data: { labels: cidadesOrdenadas.map(c=>c[0]), datasets: [{ label:"Faturamento", data: cidadesOrdenadas.map(c=>c[1]), backgroundColor:"#F03A17" }] },
      options: { maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:"#9AAABB"}}, y:{ticks:{color:"#9AAABB"}} } }
    });
  }
  const canvasMes = document.getElementById("grafico-mes");
  if(canvasMes && mesesOrdenados.length){
    GRAFICO_MES = new Chart(canvasMes, {
      type: "line",
      data: { labels: mesesOrdenados.map(m=>m[0]), datasets: [{ label:"Faturamento", data: mesesOrdenados.map(m=>m[1]), borderColor:"#FF5A2E", backgroundColor:"rgba(255,90,46,0.2)", fill:true, tension:0.3 }] },
      options: { maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:"#9AAABB"}}, y:{ticks:{color:"#9AAABB"}} } }
    });
  }
}
const ENDERECO_LOJA = "Rua Paulo Ademir Kieling, 108, Igrejinha, RS, 95650-000, Brasil";
let LOJA_GEO = null;
let MAPA_LEAFLET = null;
let MAPA_CARREGANDO = false;

function haversineKm(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function esperarMs(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function geocodeEndereco(endereco){
  try{
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(endereco);
    const resp = await fetch(url, {headers:{"Accept-Language":"pt-BR"}});
    const data = await resp.json();
    if(data && data[0]) return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
  }catch(e){ console.error("Erro ao localizar endereço", endereco, e); }
  return null;
}

function renderMapa(){
  const pedidosEntrega = pedidosAtivos().filter(p=> p.status==="AGUARDANDO_SEPARACAO" || p.status==="LIBERADO_PARA_ENTREGA");
  return `

      <button class="btn btn-amber btn-sm" id="mapa-calcular">${ic('map-pin')}Calcular distâncias e mostrar mapa</button>

    </div>
    <div class="card" id="mapa-resultado-card" style="display:none;">

      <div id="mapa-km-total" style="margin-top:14px;font-size:15px;"></div>
      <div id="mapa-lista" style="margin-top:14px;"></div>
    </div>
  `;
}
function bindMapaEvents(){
  const btn = document.getElementById("mapa-calcular");
  if(btn) btn.onclick = calcularMapa;

async function calcularMapa(){
  if(MAPA_CARREGANDO) return;
  MAPA_CARREGANDO = true;
  const status = document.getElementById("mapa-status");
  const pedidosEntrega = pedidosAtivos().filter(p=> p.status==="AGUARDANDO_SEPARACAO" || p.status==="LIBERADO_PARA_ENTREGA");

  if(!LOJA_GEO){
    status.textContent = "Localizando a loja...";
    LOJA_GEO = await geocodeEndereco(ENDERECO_LOJA);
    await esperarMs(1100);
  }
  if(!LOJA_GEO){
    status.innerHTML = '<span style="color:#FF9C86;">Não foi possível localizar o endereço da loja. Tente novamente em instantes.</span>';
    MAPA_CARREGANDO = false;
    return;
  }

  let mudou = false;
  for(let i=0;i<pedidosEntrega.length;i++){
    const p = pedidosEntrega[i];
    if(!p.geo){
      status.textContent = `Localizando endereço ${i+1} de ${pedidosEntrega.length}...`;
      const enderecoCompleto = [p.endereco, p.cidade].filter(Boolean).join(", ") + ", Brasil";
      const geo = await geocodeEndereco(enderecoCompleto);
      if(geo){ p.geo = geo; mudou = true; }
      await esperarMs(1100);
    }
  }
  if(mudou) await persist();

  status.textContent = "";
  const comGeo = pedidosEntrega.filter(p=>p.geo);
  const semGeo = pedidosEntrega.filter(p=>!p.geo);
  const distancias = comGeo.map(p=>({p, km: haversineKm(LOJA_GEO.lat, LOJA_GEO.lng, p.geo.lat, p.geo.lng)}));
  const totalKm = distancias.reduce((s,d)=>s+d.km,0);

  document.getElementById("mapa-resultado-card").style.display = "block";
  document.getElementById("mapa-km-total").innerHTML = `<b style="color:var(--amber-1);">${totalKm.toFixed(1)} km</b> ao todo em linha reta (só ida, não conta volta)${semGeo.length?(' · <span style="color:#FF9C86;">'+semGeo.length+' endereço(s) não localizado(s)</span>'):''}`;
  document.getElementById("mapa-lista").innerHTML =
    distancias.sort((a,b)=>a.km-b.km).map(d=>`
      <div class="flag-row"><label>#${escapeHtml(d.p.numero)} — ${escapeHtml(d.p.cliente)} (${escapeHtml(d.p.cidade)})</label><span class="meta">${d.km.toFixed(1)} km</span></div>
    `).join("") +
    semGeo.map(p=>`<div class="flag-row"><label>#${escapeHtml(p.numero)} — ${escapeHtml(p.cliente)}</label><span class="meta" style="color:#FF9C86;">Endereço não localizado — confira se está completo</span></div>`).join("");

  if(MAPA_LEAFLET){ MAPA_LEAFLET.remove(); MAPA_LEAFLET=null; }
  if(typeof L !== "undefined"){
    MAPA_LEAFLET = L.map('mapa-canvas').setView([LOJA_GEO.lat, LOJA_GEO.lng], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(MAPA_LEAFLET);
    L.marker([LOJA_GEO.lat, LOJA_GEO.lng]).addTo(MAPA_LEAFLET).bindPopup("Stier Bier (loja)");
    comGeo.forEach(p=>{
      L.marker([p.geo.lat, p.geo.lng]).addTo(MAPA_LEAFLET).bindPopup(`#${escapeHtml(p.numero)} — ${escapeHtml(p.cliente)}`);
      L.polyline([[LOJA_GEO.lat, LOJA_GEO.lng],[p.geo.lat, p.geo.lng]], {color:'#F03A17', weight:2, dashArray:'4,4'}).addTo(MAPA_LEAFLET);
    });
  } else {
    document.getElementById("mapa-canvas").innerHTML = '<p class="meta" style="color:#FF9C86;padding:16px;">A biblioteca de mapas não carregou. Verifique sua conexão com a internet e recarregue a página.</p>';
  }
  MAPA_CARREGANDO = false;
}
function gerarRelatorioPDF(filtrados){
  if(!filtrados || filtrados.length===0){ alertModal("Nenhum pedido para exportar com os filtros atuais."); return; }
  if(!window.jspdf){
    alertModal("Biblioteca de PDF ainda carregando, tente novamente em instantes.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text("Stier Bier - Relatorio de Entregas e Recolhas", 14, 16);
  doc.setFontSize(10);
  doc.text("Filtro: " + HISTORICO_FILTRO_RESUMO(), 14, 23);

  const cabecalho = ["Pedido", "Cliente", "Data entrega", "Entregue por", "Data recolha", "Recolhido por"];
  const colX = [14, 34, 90, 118, 152, 176];
  let y = 34;
  doc.setFontSize(8);
  doc.setFont(undefined, "bold");
  cabecalho.forEach((c,i)=> doc.text(c, colX[i], y));
  doc.setFont(undefined, "normal");
  y += 3;
  doc.line(14, y, 196, y);
  y += 5;

  filtrados.forEach(p=>{
    if(y>285){ doc.addPage(); y=20; }
    const linha = [
      String(p.numero||"-").slice(0,10),
      String(p.cliente||"-").slice(0,22),
      fmtDate(p.dataEntrega),
      String(p.entrega?.entreguePor||"-").slice(0,18),
      p.recolha?.dataRecolhaReal ? fmtDate(p.recolha.dataRecolhaReal.slice(0,10)) : "-",
      String(p.recolha?.recolhidoPor||"-").slice(0,18)
    ];
    linha.forEach((val,i)=> doc.text(val, colX[i], y));
    y += 5.5;
  });
  if(filtrados.length===0){ doc.text("Nenhum pedido no periodo selecionado.", 14, y); }
  doc.save("relatorio-stierbier-"+todayISO()+".pdf");
}
function HISTORICO_FILTRO_RESUMO(){
  const partes = [];
  if(HISTORICO_FILTRO.entreguePor) partes.push("Entregue por "+HISTORICO_FILTRO.entreguePor);
  if(HISTORICO_FILTRO.recolhidoPor) partes.push("Recolhido por "+HISTORICO_FILTRO.recolhidoPor);
  if(HISTORICO_FILTRO.inicio) partes.push("De "+fmtDate(HISTORICO_FILTRO.inicio));
  if(HISTORICO_FILTRO.fim) partes.push("Ate "+fmtDate(HISTORICO_FILTRO.fim));
  return partes.length ? partes.join(" | ") : "Todos os pedidos concluidos/cancelados";
}

  document.querySelectorAll("[data-goto]").forEach(btn=>{

function updateClock(){
  const timeEl = document.getElementById("clock-time");
  const dateEl = document.getElementById("clock-date");
  if(!timeEl || !dateEl) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  const ss = String(now.getSeconds()).padStart(2,"0");
  timeEl.innerHTML = hh+'<span class="blink-colon">:</span>'+mm+'<span class="blink-colon">:</span>'+ss;
  dateEl.textContent = now.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
}
setInterval(updateClock, 1000);

const LIMITE_CONEXAO_MS = 5*60*1000;
setInterval(async ()=>{
  if(!SESSION || !SESSAO_ATUAL_ID || !DATA || !DATA.sessoes) return;
  const s = DATA.sessoes.find(x=>x.id===SESSAO_ATUAL_ID);
  if(s && !s.logoutEm){
    s.ultimaAtividade = new Date().toISOString();
    await persist();
  }
}, 3*60*1000);

let REALTIME_ATTACHED = false;
function attachRealtimeSync(){
  if(REALTIME_ATTACHED) return;
  REALTIME_ATTACHED = true;
  db.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC).onSnapshot(snap=>{
    if(!snap.exists || !snap.data().json) return;
    let novoDATA;
    try{ novoDATA = JSON.parse(snap.data().json); }catch(e){ return; }
    DATA = novoDATA;
    const emFormulario = VIEW==="novopedido" || (["separacao","entrega","recolhas"].includes(VIEW) && ACTIVE_PEDIDO_ID);
    if(SESSION && !emFormulario){ render(); }
  }, err=>{ console.error("Erro na sincronização em tempo real", err); });
}

(async function init(){
  if(!initFirebase()){
    renderSetupScreen();
    return;
  }
  await loadData();
  render();
  attachRealtimeSync();
})();
